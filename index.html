<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY HOME · 家居实验室</title><style>*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#181818;background:#f5f5f7}header{height:60px;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #ddd}h2{font-size:18px;margin:0}main{display:grid;grid-template-columns:270px 1fr;height:calc(100vh - 60px)}aside{background:white;border-right:1px solid #ddd;padding:20px;overflow:auto}label{display:block;margin:14px 0 5px;color:#666}input,select,button{font:inherit;border:1px solid #ddd;border-radius:9px;padding:10px;width:100%;background:white}button{cursor:pointer;margin-top:9px}button.primary{background:#e60012;color:white;border:0}button.active{background:#171717;color:white}#stage{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}#plan{background:#fff;touch-action:none;max-width:95%;max-height:90%;box-shadow:0 12px 36px #0001}#three{position:absolute;inset:0;display:none}#three canvas{display:block}small{color:#888}.line{display:flex;gap:8px}.line>*{flex:1;min-width:0}.pill{background:#eee;border-radius:6px;padding:4px 8px;font-size:12px}#status{position:absolute;bottom:14px;left:16px;color:#777}hr{border:0;border-top:1px solid #eee;margin:20px 0}</style></head><body><header><h2>MY HOME <small>· 家居实验室</small></h2><span class="pill">在线版 V3.1</span></header><main><aside><b>空间</b><label>选择房间</label><select id="room"><option value="studio">15㎡多功能房</option><option value="bedroom">12.6㎡次卧</option><option value="living">15.4㎡客厅</option></select><div class="line"><div><label>宽度 cm</label><input id="rw" type="number"></div><div><label>深度 cm</label><input id="rd" type="number"></div></div><hr><b>家具</b><button class="primary" id="add">＋ 添加家具</button><label>选中家具</label><select id="items"></select><label>名称</label><input id="name"><div class="line"><div><label>宽 cm</label><input type="number" id="fw"></div><div><label>深 cm</label><input type="number" id="fd"></div><div><label>高 cm</label><input type="number" id="fh"></div></div><label>颜色</label><input id="color" type="color" style="height:44px;padding:5px"><div class="line"><button id="rotate">旋转 90°</button><button id="remove">删除</button></div><hr><div class="line"><button id="b2" class="active">2D 平面</button><button id="b3">3D 视图</button></div><button id="reset">重置当前房间</button><small>自动保存于本浏览器。家具在 2D 中可拖动；3D 中可旋转观察。3D 首次加载需要联网。</small></aside><section id="stage"><canvas id="plan" width="820" height="700"></canvas><div id="three"></div><div id="status">拖动家具调整位置 · 尺寸单位 cm</div></section></main><script>const $=id=>document.getElementById(id),key="myhome-v31",defaults={studio:{w:410,d:350,f:[{id:1,n:"沙发床",x:135,y:18,w:145,d:80,h:80,c:"#c9b6a4"},{id:2,n:"升降桌",x:300,y:105,w:65,d:130,h:75,c:"#795f4a"},{id:3,n:"父亲电脑桌",x:15,y:270,w:100,d:55,h:75,c:"#b7b7b7"}]},bedroom:{w:410,d:290,f:[]},living:{w:420,d:350,f:[]}};let data;try{data=JSON.parse(localStorage.getItem(key))||structuredClone(defaults)}catch{data=structuredClone(defaults)}let current="studio",sel=null,mode="2",drag=null,scene,renderer,camera,controls,threeReady=false;function save(){localStorage.setItem(key,JSON.stringify(data))}function room(){return data[current]}function item(){return room().f.find(f=>f.id===sel)}function draw(){const c=$("plan"),g=c.getContext("2d"),r=room(),pad=50,s=Math.min((c.width-2*pad)/r.w,(c.height-2*pad)/r.d),ox=(c.width-r.w*s)/2,oy=(c.height-r.d*s)/2;window.transform={s,ox,oy};g.clearRect(0,0,c.width,c.height);g.fillStyle="#f8f8f7";g.fillRect(ox,oy,r.w*s,r.d*s);g.strokeStyle="#111";g.lineWidth=8;g.strokeRect(ox,oy,r.w*s,r.d*s);g.fillStyle="#777";g.font="15px sans-serif";g.fillText(r.w+" cm",ox+r.w*s/2-25,oy-18);g.save();g.translate(ox-24,oy+r.d*s/2);g.rotate(-Math.PI/2);g.fillText(r.d+" cm",-20,0);g.restore();for(const f of r.f){let x=ox+f.x*s,y=oy+f.y*s,w=f.w*s,h=f.d*s;g.fillStyle=f.c;g.fillRect(x,y,w,h);g.strokeStyle=f.id===sel?"#e60012":"#555";g.lineWidth=f.id===sel?4:1.5;g.strokeRect(x,y,w,h);g.fillStyle="#222";g.font="13px sans-serif";g.fillText(f.n,x+5,y+18)}}function sync(){const r=room(),f=item();$("rw").value=r.w;$("rd").value=r.d;$("items").innerHTML=r.f.map(f=>'<option value="'+f.id+'">'+f.n+'</option>').join("");$("items").value=sel??"";for(const id of ["name","fw","fd","fh","color"]){$(id).disabled=!f;$(id).value=f?(id==="name"?f.n:id==="color"?f.c:f[id.slice(1)]):""}draw();if(mode==="3")build3()}function pick(e){const rect=$("plan").getBoundingClientRect(),px=(e.clientX-rect.left)*$("plan").width/rect.width,py=(e.clientY-rect.top)*$("plan").height/rect.height,{s,ox,oy}=window.transform,x=(px-ox)/s,y=(py-oy)/s;return {x,y}}$("plan").addEventListener("pointerdown",e=>{const p=pick(e),f=[...room().f].reverse().find(f=>p.x>=f.x&&p.x<=f.x+f.w&&p.y>=f.y&&p.y<=f.y+f.d);if(!f)return;sel=f.id;drag={dx:p.x-f.x,dy:p.y-f.y};$("plan").setPointerCapture(e.pointerId);sync()});$("plan").addEventListener("pointermove",e=>{if(!drag)return;const p=pick(e),f=item(),r=room();f.x=Math.max(0,Math.min(r.w-f.w,Math.round(p.x-drag.dx)));f.y=Math.max(0,Math.min(r.d-f.d,Math.round(p.y-drag.dy)));draw();save()});$("plan").addEventListener("pointerup",()=>{drag=null});$("plan").addEventListener("pointercancel",()=>{drag=null});$("room").onchange=e=>{current=e.target.value;sel=room().f[0]?.id??null;sync()};$("items").onchange=e=>{sel=+e.target.value;sync()};for(const id of ["rw","rd"]){$(id).onchange=e=>{room()[id==="rw"?"w":"d"]=Math.max(100,+e.target.value||100);save();sync()}}for(const id of ["name","fw","fd","fh","color"]){$(id).onchange=e=>{const f=item();if(!f)return;const k=id==="name"?"n":id==="color"?"c":id.slice(1);f[k]=id==="name"||id==="color"?e.target.value:Math.max(1,+e.target.value||1);save();sync()}}$("add").onclick=()=>{const f={id:Date.now(),n:"新家具",x:40,y:40,w:80,d:50,h:75,c:"#d3c4b5"};room().f.push(f);sel=f.id;save();sync()};$("rotate").onclick=()=>{const f=item();if(!f)return;[f.w,f.d]=[f.d,f.w];save();sync()};$("remove").onclick=()=>{room().f=room().f.filter(f=>f.id!==sel);sel=room().f[0]?.id??null;save();sync()};$("reset").onclick=()=>{if(!confirm("确定重置当前房间吗？"))return;data[current]=structuredClone(defaults[current]);sel=room().f[0]?.id??null;save();sync()};$("b2").onclick=()=>setMode("2");$("b3").onclick=()=>setMode("3");function setMode(m){mode=m;$("plan").style.display=m==="2"?"block":"none";$("three").style.display=m==="3"?"block":"none";$("b2").classList.toggle("active",m==="2");$("b3").classList.toggle("active",m==="3");if(m==="3")build3();else draw()}function build3(){const host=$("three");if(!window.THREE){host.innerHTML='<p style="padding:30px">3D 引擎加载中或网络受限，请确认网络后刷新。</p>';return}const T=THREE;if(!threeReady){host.innerHTML="";scene=new T.Scene();scene.background=new T.Color(0xf5f5f7);camera=new T.PerspectiveCamera(48,1,.1,100);renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.appendChild(renderer.domElement);controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.add(new T.HemisphereLight(0xffffff,0x999999,2));const light=new T.DirectionalLight(0xffffff,1.2);light.position.set(5,9,5);scene.add(light);threeReady=true;function tick(){requestAnimationFrame(tick);if(mode==="3"){const w=host.clientWidth,h=host.clientHeight;if(w&&h){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}controls.update();renderer.render(scene,camera)}}tick()}for(const obj of [...scene.children])if(obj.userData.model)scene.remove(obj);const r=room(),W=r.w/100,D=r.d/100;const box=(w,h,d,x,y,z,col)=>{const mesh=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshStandardMaterial({color:col,roughness:.85}));mesh.position.set(x,y,z);mesh.userData.model=true;scene.add(mesh)};box(W,.05,D,0,-.025,0,0xf1f0ed);box(W,2.5,.08,0,1.25,-D/2,0xfafafa);box(.08,2.5,D,-W/2,1.25,0,0xfafafa);for(const f of r.f){box(f.w/100,f.h/100,f.d/100,-W/2+(f.x+f.w/2)/100,f.h/200,-D/2+(f.y+f.d/2)/100,f.c)}camera.position.set(W*1.1,Math.max(W,D)*1.2,D*1.2);controls.target.set(0,0,0);controls.update()}sel=room().f[0]?.id??null;sync();</script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js" onload="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js';document.body.appendChild(s)"></script></body></html>
