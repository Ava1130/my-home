:root {
  color-scheme: light;
  --ink: #202126;
  --muted: #60636c;
  --line: #e6e7ea;
  --surface: #f5f6f8;
  --accent: #b91e32;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: #fff; color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
button, select, input, textarea { font: inherit; color: inherit; }
button, select, input:not([type=checkbox]), textarea { min-height: 36px; border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 6px 10px; }
button { cursor: pointer; white-space: nowrap; }
button:hover:not(:disabled), summary:hover { background: var(--surface); }
button:active:not(:disabled) { background: #eaecf0; }
button:disabled { color: #82858d; opacity: .64; cursor: default; }
:focus-visible { outline: 2px solid #63748b; outline-offset: 2px; }
h2 { font-size: 14px; font-weight: 650; margin: 0 0 10px; }
label, .field-label { display: block; margin: 0 0 5px; color: var(--muted); font-size: 12px; }
input:not([type=checkbox]), select, textarea { width: 100%; }
textarea { resize: vertical; }
input[type=color] { padding: 3px; }
small, .hint, .dim { color: var(--muted); font-size: 12px; }
summary { cursor: pointer; font-weight: 600; border-radius: 6px; }
.app-header { min-height: 58px; height: auto; display: grid; grid-template-columns: auto minmax(0,1fr) auto auto; justify-content: initial; gap: 18px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
.brand, .save-actions, .history-actions { display: flex; align-items: center; gap: 8px; }
.brand strong { font-size: 14px; letter-spacing: .08em; white-space: nowrap; }
.brand-mark { color: var(--accent); font-size: 20px; line-height: 1; }
.workspace-context { color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; border-left: 1px solid var(--line); padding-left: 16px; }
#saveStatus[data-failed] { color: var(--accent); font-weight: 650; }
.layout { height: auto; min-height: calc(100dvh - 58px); display: grid; grid-template-columns: 224px minmax(0,1fr); grid-template-areas: "library canvas"; grid-template-rows: minmax(0,1fr); }
.layout.has-selection { grid-template-columns: 224px minmax(0,1fr) 254px; grid-template-areas: "library canvas inspector"; }
.library, .inspector { min-width: 0; overflow: auto; background: #fff; padding: 0 15px; }
.library { grid-area: library; border-right: 1px solid var(--line); }
.inspector { grid-area: inspector; border-left: 1px solid var(--line); padding: 19px 15px; }
.panel-section { padding: 17px 0; border-bottom: 1px solid var(--line); }
.section-title { color: var(--ink); font-size: 14px; font-weight: 650; margin-bottom: 8px; }
.library-items { display: grid; gap: 6px; margin-bottom: 8px; }
.library-items button { width: 100%; display: flex; align-items: center; gap: 9px; text-align: left; padding: 8px; }
.library-items button strong, .library-items button small { display: block; }
.library-items button small { font-size: 11px; white-space: normal; }
.library-symbol { display: grid; place-items: center; flex: 0 0 24px; block-size: 24px; background: var(--surface); border-radius: 6px; color: var(--accent); }
#add, #addReferenceBed { width: 100%; margin-bottom: 6px; }
#add.primary { background: #fff; border-color: var(--line); color: var(--ink); }
#add.primary:hover:not(:disabled) { background: var(--surface); }
#schemes, #placedFurniture { margin-top: 9px; }
#schemes label, #schemePanel button, #placedFurniture label { margin-top: 8px; }
#roomdims { color: var(--muted); overflow-wrap: anywhere; }
.stage { grid-area: canvas; display: grid; grid-template-rows: auto minmax(320px,1fr) auto; min-width: 0; background: #fff; }
.bar { position: relative; min-height: 54px; padding: 8px 12px; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; z-index: 3; }
.view-switch, .zoom-tools { display: inline-flex; align-items: center; gap: 3px; }
.view-switch { border: 1px solid var(--line); border-radius: 9px; padding: 2px; background: var(--surface); }
.view-switch button { border: 0; min-height: 30px; background: transparent; }
.bar button.active { background: #fff; color: var(--ink); box-shadow: 0 1px 3px #20212624; font-weight: 650; }
.zoom-tools button { min-width: 32px; padding: 4px 6px; }
#zoomvalue { min-width: 38px; text-align: center; }
.view-tools { position: relative; margin-left: auto; }
.view-tools summary { list-style: none; padding: 7px 9px; border: 1px solid var(--line); white-space: nowrap; }
.view-tools summary::after { content: " ▾"; }
.tools-menu { position: absolute; right: 0; top: calc(100% + 6px); display: grid; min-width: 185px; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; box-shadow: 0 8px 24px #20212614; }
.tools-menu label { margin: 0; }
.view { min-width: 0; min-height: 0; display: grid; place-items: center; background: #fff; }
.plan { width: 100%; height: 100%; max-width: none; }
.plan svg { width: 100%; height: 100%; }
.room { fill: #f2f3f5; }
.room.active, .room:hover { fill: #eceef1; }
.roomname { fill: #41434b; }
.wall-segment { stroke: #3d4149; }
.furniture.selected rect { stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; }
.furniture.collision:not(.selected) rect { stroke: #73757c; stroke-dasharray: none; stroke-width: 1.2; }
.legend { padding: 9px 12px; min-height: 42px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 5px 12px; }
#status:empty { display: none; }
.inspector-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.inspector-heading h2 { margin: 0; }
#clearSelection { min-height: 30px; width: 32px; padding: 1px; font-size: 18px; }
.inspector .row { display: grid; grid-auto-columns: minmax(0,1fr); grid-auto-flow: column; gap: 6px; }
.inspector .row label { margin: 0 0 4px; }
.inspector .field-label { margin-top: 14px; font-weight: 650; color: var(--ink); }
.field-label span { font-weight: 400; color: var(--muted); }
.inline-color { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; }
.inline-color label { margin: 0; }
.inline-color input { width: 42px; }
#remove { color: var(--accent); }
.inspector-tools { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.layout-warnings { color: #683c19; background: #fbf7f0; border: 0; padding: 8px; }
@media (min-width: 921px) {
  .layout { height: calc(100dvh - 58px); }
  .view { overflow: hidden; }
}
@media (max-width: 920px) {
  .layout, .layout.has-selection { grid-template-columns: 182px minmax(0,1fr); grid-template-areas: "library canvas" "library inspector"; grid-template-rows: minmax(410px,65vh) auto; }
  .inspector { border-left: 0; border-top: 1px solid var(--line); }
}
@media (max-width: 620px) {
  .app-header { position: static; grid-template-columns: minmax(0,1fr) auto; gap: 6px 8px; padding: 8px 10px; }
  .workspace-context { grid-area: 2 / 1; border: 0; padding: 0; }
  .history-actions { grid-area: 1 / 2; }
  .save-actions { grid-area: 2 / 2; }
  .app-header button { min-height: 30px; padding: 3px 7px; }
  .layout, .layout.has-selection { display: grid; grid-template-columns: minmax(0,1fr); grid-template-areas: "library" "canvas" "inspector"; grid-template-rows: auto minmax(350px,55vh) auto; }
  .library { padding: 0 10px; border-right: 0; display: grid; grid-template-columns: 1fr 1fr; column-gap: 8px; }
  .library > section { grid-column: 1 / -1; }
  .panel-section { padding: 8px 0; }
  .library-items { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .furniture-library h2 { margin-bottom: 5px; }
  .library-items button { padding: 5px; gap: 4px; }
  .bar { padding: 6px 8px; gap: 5px; }
  .bar button, .view-tools summary { padding-inline: 6px; }
  .inspector { padding: 12px; }
}
/* Small, neutral chrome keeps attention on the plan. */
.editor-version { color:#696969; font-size:10px; letter-spacing:.04em; }
:root { --ink:#242424; --muted:#606060; --line:#e7e7e7; --surface:#f5f5f5; }
.room, .room[data-room] { fill:#f3f3f3; }
.room.active, .room[data-room]:hover { fill:#efefef; }
.roomname { font-size:18px; fill:#393939; }
.area { font-size:13px; fill:#656565; }
.furniture.selected rect { stroke-width:1.5; }
.live-measure-readout span { color:#515151; }
.measurement .measure-line, .wall-measure .measure-line { stroke:#6c6c6c; stroke-width:1; stroke-dasharray:4 3; vector-effect:non-scaling-stroke; }
.measurement .measure-dot { fill:#6c6c6c; r:2; }
.measurement .measure-label, .wall-measure .measure-label { fill:#3d3d3d; font-size:12px; font-weight:600; stroke-width:2.2; }
.inspector-heading { margin-bottom:9px; }
.inspector .field-label { margin-top:10px; }
.inline-color { margin:8px 0; }
@media (min-width: 921px) {
  .layout { grid-template-columns:224px minmax(0,1fr) 0px;
             grid-template-areas:"library canvas inspector"; transition:grid-template-columns 160ms ease-out; }
  .layout.has-selection { grid-template-columns:224px minmax(0,1fr) 254px; }
  @media (prefers-reduced-motion: reduce) { .layout { transition:none; } }
}
@media (max-width: 620px) {
  .library > section:first-child { display:flex; align-items:center; gap:8px; }
  .library > section:first-child label { margin:0; }
  .library > section:first-child select { min-width:0; }
  .furniture-library #add { width:auto; padding-inline:8px; margin:0; }
  .furniture-library #placedFurniture { margin-top:6px; }
  .layout,.layout.has-selection { grid-template-rows:auto minmax(420px,59dvh) auto; }
  .view { height:auto; min-height:0; }
  .stage { grid-template-rows:auto minmax(0,1fr) auto; }
}
 .sofa-bed-controls { margin-top:12px; padding:10px 0 0; border-top:1px solid var(--line); }
.sofa-bed-controls .sofa-depths { margin-top:8px; }

.furniture .expanded-area, .furniture.selected .expanded-area { fill:#5d819946; stroke:#365e75; stroke-width:1.25; stroke-dasharray:4 3; vector-effect:non-scaling-stroke; pointer-events:none; }
.mirror-front {stroke:#365e75;stroke-width:1.5;vector-effect:non-scaling-stroke;pointer-events:none}

.asset-dialog{width:min(410px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-sizing:border-box;border:1px solid #dedede;border-radius:14px;padding:20px;color:#171717}

<header class="app-header">
  <div class="brand"><span class="brand-mark" aria-hidden="true">⌂</span><strong>MY HOME</strong><span class="editor-version">V5.2</span></div>
  <div id="workspaceContext" class="workspace-context">全屋户型</div>
  <div class="history-actions"><button id="undo" title="Ctrl / ⌘ + Z">撤销</button><button id="redo" title="Ctrl / ⌘ + Shift + Z">重做</button></div>
  <div class="save-actions"><span id="saveStatus" class="dim" role="status"></span><button id="save">保存</button></div>
</header>
<div class="layout" id="workspace">
  <aside class="library" aria-label="空间与家具库">
    <section class="panel-section"><label class="section-title" for="room">空间</label><select id="room" aria-label="查看范围"></select></section>
    <section class="panel-section furniture-library">
      <h2>家具库</h2>
      <div id="studioQuickAdd" class="library-items">
        <button type="button" id="addStudioSofa"><span class="library-symbol" aria-hidden="true">＋</span><span><strong>沙发床</strong><small id="studioSofaState">多功能房 · 实拍</small></span></button>
        <button type="button" id="addStudioMirror"><span class="library-symbol" aria-hidden="true">＋</span><span><strong>带轮全身镜</strong><small id="studioMirrorState">多功能房 · 实拍</small></span></button>
      </div>
      <button id="addReferenceBed" hidden>加入实拍床</button><button class="primary" id="add" style="width:100%">＋ 添加普通家具</button>
      <div class="asset-heading"><h3>我的家具</h3><button type="button" id="newAsset" disabled>＋ 添加家具</button></div>
      <p class="asset-notice" id="assetNotice" role="status"></p>
      <div id="assetList" class="asset-list"></div>
      <div id="placedFurniture" hidden><label for="items">当前布局的家具</label><select id="items"></select></div>
    </section>
    <details class="panel-section" id="schemePanel"><summary>方案管理</summary><section id="schemes" hidden><label for="scheme">布局方案</label><select id="scheme"></select><button id="copyScheme" type="button">复制当前方案</button><div class="scheme-notes"><label for="schemeName">方案名称</label><input id="schemeName" maxlength="32" placeholder="如：保留阳台通道"><label for="schemeNote">方案备注</label><textarea id="schemeNote" maxlength="280" rows="2" placeholder="记下这个布局的用途或取舍"></textarea><button id="saveSchemeNotes" type="button" disabled>保存方案笔记</button></div><div id="comparisonControls" hidden><label for="comparisonSlot">叠图对比 · 2D</label><select id="comparisonSlot"></select><p id="comparisonSummary" class="hint" aria-live="polite"></p></div></section><button id="reset">恢复当前空间</button></details>
    <details class="panel-section"><summary>房屋信息</summary><div id="roomdims" class="hint"></div></details>
  </aside>
  <main class="stage">
    <div class="bar" aria-label="画布工具">
      <div class="view-switch" role="group" aria-label="视图"><button id="b2" class="active">2D 平面</button><button id="b3">3D 示意</button></div>
      <div id="zoomTools" class="zoom-tools" role="group" aria-label="平面缩放"><button id="zoomout" title="缩小 2D 平面图" aria-label="缩小平面图">−</button><span id="zoomvalue" class="dim" aria-live="polite">100%</span><button id="zoomin" title="放大 2D 平面图" aria-label="放大平面图">＋</button></div>
      <button id="homeview" aria-label="重置视角" title="恢复默认视角或平面缩放">重置</button>
      <details id="viewTools" class="view-tools"><summary>视图选项</summary><div class="tools-menu"><label id="measureModeLabel" class="measure-mode-label" for="measureMode">距离显示 <select id="measureMode" aria-label="距离标注类型"><option value="all">全部</option><option value="furniture">家具之间</option><option value="walls">四侧墙距</option><option value="none">关闭</option></select></label><select id="walls" hidden aria-label="3D 墙体显示"><option value="auto">自动剖切</option><option value="full">完整墙体</option><option value="low">低墙剖切</option></select><button id="kitchenfront" hidden>厨房门正视</button><select id="kitchenslide" hidden aria-label="厨房门滑动示意"><option value="0">向左 · 实拍状态</option><option value="0.5">居中 · 示意</option><option value="1">向右 · 示意</option></select></div></details>
    </div>
    <div class="view">
      <div class="plan" id="plan"></div><div id="liveMeasureReadout" class="live-measure-readout" role="status" aria-live="off" hidden></div><div id="three"></div>
    </div>
    <footer id="legend" class="legend"><small></small><span id="status" class="dim" role="status"></span></footer>
  </main>
  <aside class="inspector" id="inspector" aria-label="家具属性" hidden>
    <div class="inspector-heading"><h2>家具属性</h2><button id="clearSelection" type="button" aria-label="取消选中">×</button></div>
    <div id="editor">
      <p id="furnitureModelLabel" class="asset-notice"></p>

function loadLayouts() {
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey));
    if (saved?.version === 2 && saved.rooms) return saved;
    // Preserve old A/B/C user layouts while migrating the formerly 3D-only
    // photographed sofa into the shared editable furniture records.
    if (saved?.version === 1 && saved.rooms) {
      const room=saved.rooms.living;
      if (room) {
        const addIfMissing=items=>{
          if (Array.isArray(items) && !items.some(item=>item.id===referenceLivingSofa.id))
            items.push(structuredClone(referenceLivingSofa));
        };
        addIfMissing(room.baseline);
        for (const items of Object.values(room.variants || {})) addIfMissing(items);
      }
      saved.version=2;
      return saved;
    }
  } catch {}
  let legacy;
  try { legacy = JSON.parse(localStorage.getItem('myhome-v32')); } catch {}
  const source = legacy?.f || defaults;
  const rooms = {};
  for (const room of Object.keys(plan.rooms)) {
    let baseline = Array.isArray(source[room]) ? structuredClone(source[room]) : [];
    // Keep the real sofa in a living room migrated from legacy v3.2 as well.
    if (room === 'living' && !baseline.some(item=>item.id===referenceLivingSofa.id)) baseline.push(structuredClone(referenceLivingSofa));
    if (room === 'studio') baseline = baseline.filter(item => !retiredStudioPlaceholders.some(placeholder =>
      Object.keys(item).length === Object.keys(placeholder).length &&
      Object.entries(placeholder).every(([field,value]) => item[field] === value)));
    rooms[room] = {baseline, active:'A', variants:{A:structuredClone(baseline)}};
  }
  return {version:2,rooms};
}

function save() {
  const indicator=$('saveStatus');
  try {
    localStorage.setItem(storageKey,JSON.stringify(data));
    delete indicator.dataset.failed;
    indicator.textContent='已保存到本机';
  } catch {
    indicator.dataset.failed='';
    indicator.textContent='未保存 · 可点击保存重试';
  }
}

function roomHistory(key) {
  const layout=data.rooms[key];
  if (!layout) return null;
  const id=key+':'+layout.active;
  if (!histories.has(id)) histories.set(id,{undo:[],redo:[]});
  return histories.get(id);
}

function snapshot(key) {
  return {items:structuredClone(furniture(key)),selected:current===key ? selected : null};
}

function commitEdit(key,before) {
  if (JSON.stringify(before.items)===JSON.stringify(furniture(key))) return;
  const {undo,redo}=roomHistory(key);
  undo.push(before);
  if (undo.length>60) undo.shift();
  redo.length=0;
  save();
}

function applyEdit(change,message) {
  const before=snapshot(current);
  change();
  commitEdit(current,before);
  sync();
  if (message) $('status').textContent=message;
}

function navigateHistory(direction) {
  const layout=data.rooms[current], history=roomHistory(current);
  const next=history?.[direction].pop();
  if (!next) return;
  history[direction==='undo' ? 'redo' : 'undo'].push(snapshot(current));
  layout.variants[layout.active]=next.items;
  selected=next.selected;
  save();
  sync();
  $('status').textContent=direction==='undo' ? '已撤销上一步' : '已重做上一步';
}

const isStudioSofa = item => item?.model==='photo-studio-sofa';
const sofaDepthAxis = item => (item.turns || 0)%2 ? 'w' : 'd';

function sofaBedSettings(item) {
  if (item.sofaBed) return item.sofaBed;
  const foldedDepth=item[sofaDepthAxis(item)];
  // A sample footprint for experiments; old layouts retain their existing depth.
  return {state:'folded',foldedDepth,expandedDepth:Math.max(155,Math.round((foldedDepth+1)*10)/10)};
}

function sofaFootprintAtDepth(item,depth) {
  const axis=sofaDepthAxis(item);
  const delta=Math.round((depth-item[axis])*10)/10;
  const turns=item.turns || 0;
  const next={x:item.x,y:item.y,w:item.w,d:item.d};
  next[axis]=depth;
  // Keep the rear edge fixed when the forward edge is in the negative direction.
  if (turns===1) next.x=Math.round((next.x-delta)*10)/10;
  if (turns===2) next.y=Math.round((next.y-delta)*10)/10;
  return next;
}

function editSofaBed(item,settings,message) {
  const selectedDepth=settings.state==='expanded' ? settings.expandedDepth : settings.foldedDepth;
  const next=sofaFootprintAtDepth(item,selectedDepth);
  const [, ,width,depth]=plan.rooms[current].box;
  if (next.x<0 || next.y<0 || next.x+next.w>width+.0001 || next.y+next.d>depth+.0001) {
    sync(true);
    $('status').textContent='当前摆位放不下这个状态，请先移动沙发床或调整进深。';
    return;
  }
  applyEdit(()=>Object.assign(item,next,{sofaBed:settings}),message);
}

function setSofaBedDepth(item,field,value) {
  const settings={...sofaBedSettings(item),[field]:Math.round(value*10)/10};
  const [, ,width,depth]=plan.rooms[current].box;
  const axisLimit=sofaDepthAxis(item)==='w' ? width : depth;
  const changed=settings[field];
  if (!Number.isFinite(changed) || changed<1 || changed>axisLimit || settings.expandedDepth<=settings.foldedDepth) {
    sync(true);
    $('status').textContent='请输入房间范围内的正数，展开进深须大于收起进深。';
    return;
  }
  editSofaBed(item,settings,'已更新暂定进深 · 可撤销');
}

function updateSofaBedInspector(item) {
  $('sofaBedControls').hidden=!isStudioSofa(item);

  const settings=sofaBedSettings(item);

  $('expandedDepth').value=settings.expandedDepth;
  const info=$('sofaBedFeedback');
  info.textContent='宽约 200 cm。两种进深和展开机构均暂定。';
  if (settings.state!=='expanded') return;
  const addedDepth=settings.expandedDepth-settings.foldedDepth;
  info.textContent+=' 蓝色区域为展开增加的占地（'+addedDepth.toFixed(1)+' cm 进深）。';
  const overlap=furnitureCollisions(current).get(String(item.id)) || [];
  if (overlap.length) info.textContent+=' 占地重叠：'+[...new Set(overlap)].join('、')+'。';
  const mirror=furniture(current).find(f=>f.model==='photo-studio-mirror');
  const fixed=roomObstacles(current,item.id).filter(o=>o.kind==='fixed')

  const targets=(measureMode==='walls'?[]:roomObstacles(key,item.id).map(o=>({name:o.name,gap:rectangleGap(item,o)}))).sort((a,b)=>a.gap-b.gap);
  const walls=measureMode==='furniture'?[]:wallClearances(key,item);

    const line=document.createElement('span');

    panel.appendChild(line);
  });
  targets.forEach(t=>{
    const line=document.createElement('span');

  const furnitureLines=obstacles.map(target=>({...target,...closestPoints(item,target)}))
    .filter(target=>target.gap>=0.5)
    .sort((a,b)=>a.gap-b.gap)

      const midX=(ax+bx)/2,midY=(ay+by)/2;
      const horizontal=Math.abs(by-ay)<0.5;

function segments(w) {

  if (start < w.to) solid.push([start, w.to]);

    const name = glass ? '推拉玻璃门' : '推拉门';

      const leaf = start+travel*kitchenSlide;
      const {trackOffset} = o.floorSlider;
      return `<g data-opening="${o.type}" data-opening-id="${o.id}"><title>落地玻璃推拉门 · 位置及洞口宽度沿用 · 高度、门扇宽度和行程暂定</title>` +
        line(w,o.from,o.to,'slider-track',-trackOffset) + line(w,o.from,o.to,'slider-track',trackOffset) +
        line(w,leaf,leaf+leafWidth,'slider-panel glass') + '</g>';

      line(w,o.from,o.to,'slider-panel' + (glass ? ' glass' : '')) +
      line(w,o.from,o.to,'slider-track',-6) + line(w,o.from,o.to,'slider-track',6) + '</g>';

function compareLayouts(room,slot) {
  const reference=data.rooms[room]?.variants[slot];
  if (!reference || slot===data.rooms[room].active) return null;
  const activeById=new Map(furniture(room).map(item=>[item.id,item]));
  const changed=[], referenceOnly=[];
  for (const item of reference) {
    const active=activeById.get(item.id);
    if (!active) {
      referenceOnly.push(item);
      continue;
    }
    activeById.delete(item.id);
    const moved=item.x!==active.x || item.y!==active.y;
    const resized=['w','d','h'].some(field=>item[field]!==active[field]);
    const rotated=(item.turns ?? 0)!==(active.turns ?? 0);
    const appearance=item.n!==active.n || item.c!==active.c;
    if (moved || resized || rotated || appearance) changed.push({item,moved,resized,rotated,appearance});

function updateComparisonControls() {
  const layout=data.rooms[current], select=$('comparisonSlot');

  const summary=$('comparisonSummary');

  if (!layout || mode!=='2') return;
  const alternatives=slots.filter(slot=>slot!==layout.active && layout.variants[slot]);
  select.replaceChildren(new Option('关闭对比',''),...alternatives.map(slot=>new Option('叠显'+schemeLabel(layout,slot),slot)));
  select.disabled=!alternatives.length;
  const slot=compareByRoom.get(current);
  select.value=alternatives.includes(slot) ? slot : '';
  const result=compareLayouts(current,slot);
  if (!result) {
    if (!alternatives.length) summary.textContent='建立另一方案后即可叠图比较。';
    return;

  const {changed,referenceOnly,activeOnly}=result;
  const notes=changed.map(({item,moved,resized,rotated,appearance})=>
    item.n+' · '+[moved && '位置',resized && '尺寸',rotated && '朝向',appearance && '名称或颜色'].filter(Boolean).join('、'));
  if (referenceOnly.length) notes.push('仅 '+slot+'：'+referenceOnly.map(item=>item.n).join('、'));
  if (activeOnly.length) notes.push('仅 '+layout.active+'：'+activeOnly.map(item=>item.n).join('、'));
  const referenceNote=schemeMetadata(layout,slot).note;
  summary.textContent='实色 '+schemeLabel(layout,layout.active)+' · 蓝色虚线 '+schemeLabel(layout,slot)
    +(referenceNote ? '\n对照方案备注：'+referenceNote : '')
    +'\n'+(notes.join('\n') || '两方案的活动家具一致。');
}

function comparisonOverlay(room) {

  updateMeasureReadout(key,f);
  el.setPointerCapture(event.pointerId);
  const obstacles=roomObstacles(key,f.id);
  function updateDrag(e) {
    moved=true;
    const pos=local(e), next={w:f.w,d:f.d};
    const snapped=snapPosition(next,key,originalX+pos.x-start.x,originalY+pos.y-start.y);
    next.x=snapped.x;next.y=snapped.y;
    ({x:nextX,y:nextY}=next);
    el.setAttribute('transform',`translate(${ox+nextX} ${oy+nextY})`);
    if(liveDimensions) liveDimensions.innerHTML=dimensionOverlay(key,{...f,x:nextX,y:nextY});
    updateMeasureReadout(key,{...f,x:nextX,y:nextY});
    const previewConflict=obstacles.some(other=>Math.min(nextX+f.w,other.x+other.w)-Math.max(nextX,other.x)>0.5 && Math.min(nextY+f.d,other.y+other.d)-Math.max(nextY,other.y)>0.5);
    $('status').textContent=`${f.n} · X ${nextX.toFixed(1)} cm / Y ${nextY.toFixed(1)} cm${snapped.labels.length ? ' · 吸附：'+snapped.labels.join('、') : ''}${previewConflict ? ' · ⚠ 家具占地重叠' : ''}`;
  }
  el.onpointermove=e=>{
    if (e.pointerId!==event.pointerId || (!moved && Math.hypot(e.clientX-event.clientX,e.clientY-event.clientY)<3)) return;
    pendingEvent=e;
    if (!nextFrame) nextFrame=requestAnimationFrame(()=>{
      nextFrame=null;
      const latest=pendingEvent;
      pendingEvent=null;
      if (latest) updateDrag(latest);
    });
  };
  function finish(e) {
    if (e.pointerId!==event.pointerId) return;
    if (nextFrame) cancelAnimationFrame(nextFrame);
    if (e.type==='pointerup' && pendingEvent) updateDrag(pendingEvent);
    el.onpointermove=el.onpointerup=el.onpointercancel=el.onlostpointercapture=null;
    if (e.type==='pointerup') {
      if (moved) {
        f.x=nextX;
        f.y=nextY;
        commitEdit(key,before);
      }
      selectRoom(key,f.id);
      $('status').textContent=moved ? `已调整 ${f.n} · 可撤销` : `已选中 ${f.n}`;
    } else sync();
  }
  el.onpointerup=el.onpointercancel=el.onlostpointercapture=finish;
}

  if (!sameRoom) planZoom=planZoomByRoom.get(key) ?? 1;

function bind3dFurnitureSelection(canvas,THREE) {
  const ray=new THREE.Raycaster();
  const ground=new THREE.Plane(new THREE.Vector3(0,1,0),0);
  let drag, blankPress;
  function aim(event) {
    const bounds=canvas.getBoundingClientRect();
    const x=(event.clientX-bounds.left)/bounds.width*2-1;
    const y=1-(event.clientY-bounds.top)/bounds.height*2;
    ray.setFromCamera(new THREE.Vector2(x,y),camera);
  }
  function pick() {
    const hit=ray.intersectObject(model,true).find(({object})=>{
      for (let node=object;node;node=node.parent) if (!node.visible) return false;
      return true;
    });
    for (let node=hit?.object;node;node=node.parent) {
      if (node.userData.furniture) return node;
    }
    return null;
  }
  function pointOnFloor() {return ray.ray.intersectPlane(ground,new THREE.Vector3());}
  // Capture before OrbitControls handles a pointer that starts on movable furniture.
  canvas.addEventListener('pointerdown',e=>{
    if (!model || mode!=='3' || !e.isPrimary || e.button!==0 || e.shiftKey) return;
    aim(e);
    const group=pick();
    if (!group) {
      blankPress={id:e.pointerId,x:e.clientX,y:e.clientY};
      return;
    }
    e.preventDefault();
    const refreshGeometry=document.activeElement?.matches('input,textarea,[contenteditable]');
    deferSceneRefresh=true;
    try { commitFocusedField(); }
    finally { deferSceneRefresh=false; }
    const {room,id}=group.userData.furniture;
    const item=furniture(room).find(f=>f.id===id), start=pointOnFloor();
    if (!item || !start) return;
    drag={id:e.pointerId,room,item,group,start,screenX:e.clientX,screenY:e.clientY,
      x:item.x,y:item.y,before:snapshot(room),wasEnabled:controls.enabled,refreshGeometry};
    controls.enabled=false;
    canvas.setPointerCapture(e.pointerId);
    canvas.style.cursor='grabbing';
  },true);
  canvas.addEventListener('pointermove',e=>{
    if (blankPress?.id===e.pointerId && Math.hypot(e.clientX-blankPress.x,e.clientY-blankPress.y)>4) blankPress=null;
    if (!drag) {
      if (model && mode==='3' && !e.buttons) {
        aim(e);
        canvas.style.cursor=pick() ? 'grab' : '';
      }
      return;
    }
    if (e.pointerId!==drag.id || (!drag.moved && Math.hypot(e.clientX-drag.screenX,e.clientY-drag.screenY)<4)) return;
    aim(e);
    const point=pointOnFloor();
    if (!point) return;
    drag.moved=true;
    const {item,start,room,group}=drag;
    const {x,y}=snapPosition(item,room,item.x+(point.x-start.x)*100,item.y+(point.z-start.z)*100);
    drag.x=x; drag.y=y;
    group.position.set((x-item.x)/100,0,(y-item.y)/100);
    $('status').textContent=item.n+' · X '+x.toFixed(1)+' cm / Y '+y.toFixed(1)+' cm';
  });
  function finish(e) {
    if (blankPress?.id===e.pointerId) {
      const start=blankPress;
      blankPress=null;
      if (e.type==='pointerup' && mode==='3' && selectedItem() && Math.hypot(e.clientX-start.x,e.clientY-start.y)<4) {
        selectRoom(current);
      }
      return;
    }
    if (drag?.id!==e.pointerId) return;
    const action=drag;
    drag=null;
    controls.enabled=action.wasEnabled;
    canvas.style.cursor='';
    action.group.position.set(0,0,0);
    if (mode!=='3' || !model.children.includes(action.group)) return;
    if (e.type!=='pointerup') {
      sync();
      return;
    }
    if (action.moved) {
      action.item.x=action.x; action.item.y=action.y;
      commitEdit(action.room,action.before);
    }
    selectRoom(action.room,action.item.id,action.moved || action.refreshGeometry);
    $('status').textContent=action.moved ? '已移动 '+action.item.n+' · 可撤销' : '已选中 '+action.item.n;
  }
  canvas.addEventListener('pointerup',finish);
  canvas.addEventListener('pointercancel',finish);
  canvas.addEventListener('lostpointercapture',finish);
}

async function initialize3d() {
  const [THREE,{OrbitControls}] = await Promise.all([
    import('https://esm.sh/three@0.164.1'),
    import('https://esm.sh/three@0.164.1/examples/jsm/controls/OrbitControls.js')
  ]);
  three = THREE;
  const host = $('three');
  const nextRenderer = new THREE.WebGLRenderer({antialias:true});
  nextRenderer.setPixelRatio(Math.min(devicePixelRatio || 1,2));
  host.replaceChildren(nextRenderer.domElement);
  new ResizeObserver(size3d).observe(host);
  bind3dFurnitureSelection(nextRenderer.domElement,THREE);
  renderer = nextRenderer;
  scene = new THREE.Scene();
  scene.background = new THREE.Color('#f7f7f7');
  camera = new THREE.PerspectiveCamera(45,1,.05,200);
  controls = new OrbitControls(camera,renderer.domElement);
  controls.enableDamping = true;
  scene.add(new THREE.HemisphereLight(0xffffff,0x9e9183,1.55));
  const light = new THREE.DirectionalLight(0xfff3e3,2.05);
  light.position.set(4,9,5);
  scene.add(light);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  controls.minDistance = 1;
  controls.maxDistance = 70;
  controls.maxPolarAngle = Math.PI * .49;
  renderer.setAnimationLoop(() => {
    if (mode === '3') {
      controls.update();
      updateWallVisibility();
      renderer.render(scene,camera);
    }
  });
}

function updateFurnitureHighlight() {
  for (const group of model.children) {
    const item=group.userData.furniture;
    if (!item) continue;
    const active=item.room===current && item.id===selected;
    for (const mesh of group.children) {
      mesh.material.emissive.set('#752e24');
      mesh.material.emissiveIntensity=active ? .24 : 0;
    }
  }
}

function size3d() {
  if (!renderer || mode !== '3') return;
  const {clientWidth:w,clientHeight:h} = $('three');
  if (!w || !h) return;
  const canvas=renderer.domElement;
  const ratio=renderer.getPixelRatio();
  if (canvas.width===Math.floor(w*ratio) && canvas.height===Math.floor(h*ratio) && camera.aspect===w/h) return;
  const keepFit=autoFrame?.key===current && camera.position.distanceToSquared(autoFrame.eye)<1e-6
    && controls.target.distanceToSquared(autoFrame.target)<1e-6;
  renderer.setSize(w,h);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  if (keepFit) frame3d();
}

// Display assumptions in centimetres. The 2D footprints and measured notes
// remain in plan; no value here represents a new measurement of the home.
const previewGeometry = {
  wallHeight:260, wallThickness:13, cutHeight:35, doorTop:210,
  windowSill:88, windowTop:210, frameWidth:4, deskHeight:76
};
let wallLayers = [];
$('walls').onchange = updateWallVisibility;

function updateWallVisibility() {
  if (!camera) return;
  const mode = $('walls').value;
  for (const {axis,side,plane,upper,lower} of wallLayers) {
    const coordinate = axis === 'h' ? camera.position.z : camera.position.x;
    const cut = mode === 'low' || (mode === 'auto' && side !== 0 && (coordinate-plane)*side > 0);
    upper.visible = !cut;
    lower.visible = cut;
  }
}

function frame3d() {
  const [, , w,d]=viewBox();
  const target=new three.Vector3(0,current==='all' ? .75 : 1.10,0);
  const direction=new three.Vector3(.82,1.14,['all','dining'].includes(current) ? -1 : 1).normalize();
  const right=new three.Vector3().crossVectors(camera.up,direction).normalize();
  const up=new three.Vector3().crossVectors(direction,right);
  const tangent=Math.tan(three.MathUtils.degToRad(camera.fov/2))*.88;
  let distance=0;
  for (const x of [-w/200-.10,w/200+.10]) {
    for (const z of [-d/200-.10,d/200+.10]) {
      for (const y of [0,previewGeometry.wallHeight/100]) {
        const corner=new three.Vector3(x,y,z).sub(target);
        const fit=Math.max(Math.abs(corner.dot(right))/(tangent*camera.aspect),Math.abs(corner.dot(up))/tangent);
        distance=Math.max(distance,corner.dot(direction)+fit);
      }
    }
  }
  controls.target.copy(target);
  controls.maxDistance=Math.max(70,distance*2);
  camera.position.copy(direction).multiplyScalar(distance).add(target);
  controls.update();
  frameKey=current;
  autoFrame={key:current,eye:camera.position.clone(),target:controls.target.clone()};
}

function restoreRoomCamera() {
  if (frameKey===current) return;
  if (frameKey) cameraByRoom.set(frameKey,{eye:camera.position.clone(),target:controls.target.clone(),
    auto:autoFrame?.key===frameKey && camera.position.distanceToSquared(autoFrame.eye)<1e-6
      && controls.target.distanceToSquared(autoFrame.target)<1e-6});
  const previous=cameraByRoom.get(current);
  if (!previous || previous.auto) {
    frame3d();
    return;
  }
  autoFrame=null;
  camera.position.copy(previous.eye);
  controls.target.copy(previous.target);
  controls.update();
  frameKey=current;
}

// Cabinet faces are laid out in local width/depth coordinates, then turned
// to face the dining area. Subdivisions are visual proportions from photos.
function buildDiningCabinet(asset, [x,y], box, group) {
  const [{box:[px,py,w,d],height}] = asset.parts;
  const vertical = asset.facing === 'right';
  const span = vertical ? d : w;
  const depth = vertical ? w : d;
  const wood = '#523828', white = '#eeeae3', dark = '#24211e', smoke = '#303536';
  function board(u,v,width,thickness,base,top,color,opacity=1) {
    const position = vertical
      ? [x+px+v,y+py+span-u-width,thickness,width]
      : [x+px+u,y+py+depth-v-thickness,width,thickness];
    box(...position,top-base,color,base,opacity,group);
  }
  function doors(start, width, count, base, top) {
    const pitch = width/count;
    for (let i=0; i<count; i++) {
      board(start+i*pitch+.45,depth-2,pitch-.9,2,base,top,white);
    }
  }
  const short = asset.cabinet === 'sideboard';
  const counter = short ? height-3 : height*.38;
  const toe = short ? 13 : 4;
  board(0,0,3,depth,0,counter,wood);
  board(span-3,0,3,depth,0,counter,wood);
  board(3,0,span-6,2,toe,counter,wood);
  board(3,2,span-6,depth-4,toe,toe+3,dark);
  board(0,0,span,depth,counter-3,counter,wood);
  doors(3,span-6,short ? 4 : 5,toe+1,counter-4);
  if (short) {
    board(0,0,span,2,counter,height,wood);
    board(0,2,3,depth-3,counter,height,wood);
    board(span-3,2,3,depth-3,counter,height,wood);
    return;
  }

  const glassEnd = span*.61, drawerEnd = span*.80;
  const glassBottom = height*.69, drawersTop = height*.66;
  board(0,0,span,2,counter,height,wood);
  board(0,0,span,depth,height-3,height,wood);
  for (const edge of [0,glassEnd,drawerEnd,span-3]) {
    board(edge,2,3,depth-2,counter,height-3,wood);
  }
  board(3,2,glassEnd-5,depth*.72,counter+29,counter+32,wood);
  for (const shelf of [glassBottom,glassBottom+23]) {
    board(3,2,glassEnd-3,depth-5,shelf,shelf+2,wood);
  }
  const pitch = (glassEnd-3)/3;
  for (let i=0; i<3; i++) {
    const u = 3+i*pitch;
    const top = height-4;
    for (const edge of [u,u+pitch-1.4]) {
      board(edge,depth-2,1.4,2,glassBottom,top,dark);
    }
    board(u,depth-2,pitch,2,glassBottom,glassBottom+1.4,dark);
    board(u,depth-2,pitch,2,top-1.4,top,dark);
    board(u+1.4,depth-1.5,pitch-2.8,1,glassBottom+1.4,top-1.4,smoke,.73);
  }
  board(glassEnd+3,2,drawerEnd-glassEnd-3,depth-4,drawersTop,drawersTop+2,wood);
  const drawerHeight = (drawersTop-counter)/3;
  for (let i=0; i<3; i++) {
    const base = counter+i*drawerHeight;
    board(glassEnd+3,depth-2,drawerEnd-glassEnd-3.5,2,base+1,base+drawerHeight-1,white);
  }
  doors(drawerEnd+3,span-drawerEnd-6,1,counter+1,height-4);
}

function buildMediaWall(asset, [ox,oy], box, group) {
  const wood = '#523a2d', dark = '#232325', white = '#edeae6';
  const [left,base,right] = asset.parts;
  for (const {box:[x,y,w,d],height} of [left,right]) {
    const add = (u,v,width,depth,bottom,top,color,opacity=1) =>
      box(ox+x+u,oy+y+v,width,depth,top-bottom,color,bottom,opacity,group);
    add(0,d-2,w,2,4,height,wood);
    for (const side of [0,w-2]) {
      add(side,0,2,d,0,height,wood);
      add(side,0,2,1,4,height-2,dark);
    }
    for (const level of [4,44,83,122,161,200,height-2]) {
      add(2,2,w-4,d-4,level,level+2,wood);
    }
    for (const level of [4,height-4]) add(2,0,w-4,1,level,level+2,dark);
    add(2,1,w-4,1,6,height-4,'#333d40',.42);
  }
  const {box:[x,y,w,d],height} = base;
  box(ox+x,oy+y+2,w,d-2,height-5,wood,2,1,group);
  box(ox+x,oy+y,w,d,3,wood,height-3,1,group);
  for (let i=0; i<6; i++) {
    box(ox+x+i*w/6+.55,oy+y,w/6-1.1,2,height-9,white,5,1,group);
  }
  const screenWidth = w*.74, screenHeight = screenWidth*9/16;
  box(ox+x+(w-screenWidth)/2,oy+y+d-5,screenWidth,3,screenHeight,dark,74,1,group);
  box(ox+x+(w-screenWidth)/2+1,oy+y+d-5.4,screenWidth-2,.5,screenHeight-2,'#161c21',75,1,group);

function buildFloorSlider(wall, opening, strip) {
  const {sill,head,jamb,rail,frame,trackOffset} = opening.floorSlider;
  const {from,to} = opening;
  const {start,leafWidth,travel} = floorSliderLayout(opening);
  const stop = start+leafWidth;
  const metal = '#202427';
  const assembly = new three.Group();
  assembly.name = opening.id;
  model.add(assembly);
  strip(assembly,from,start,sill,head,8,metal);
  strip(assembly,to-jamb,to,sill,head,8,metal);
  for (const offset of [-trackOffset,trackOffset]) {
    strip(assembly,from,to,sill,sill+rail,1.5,metal,offset);
    strip(assembly,from,to,head-rail,head,1.5,metal,offset);
  }
  const leaf = new three.Group();
  leaf.name = 'kitchen-sliding-leaf';
  leaf.userData.axis = wall.axis === 'h' ? 'x' : 'z';
  leaf.userData.travel = travel/100;
  assembly.add(leaf);
  const bottom = sill+rail, top = head-rail;
  strip(leaf,start,start+frame,bottom,top,2.5,metal,trackOffset);
  strip(leaf,stop-frame,stop,bottom,top,2.5,metal,trackOffset);
  strip(leaf,start+frame,stop-frame,bottom,bottom+frame,2.5,metal,trackOffset);
  strip(leaf,start+frame,stop-frame,top-frame,top,2.5,metal,trackOffset);
  strip(leaf,start+frame,stop-frame,bottom+frame,top-frame,.8,'#9db3bb',trackOffset,.29);
  updateKitchenLeaf();
}

function buildPhotoBed(f,x,y,box,group) {
  const turns = (f.turns || 0)%4;
  const length = turns%2 ? f.d : f.w;
  const width = turns%2 ? f.w : f.d;
  const clearance = Math.min(calibration.bed.find(record => record.field === 'underframeClearance').value,f.h*.24);
  const platform = f.h*.36, mattress = f.h*.54;
  const wood = '#78513b', trim = '#62402f';
  function part(u,v,l,w,bottom,top,color) {
    const bounds = [
      [u,v,l,w], [width-v-w,u,w,l],
      [length-u-l,width-v-w,l,w], [v,length-u-l,w,l]
    ][turns];
    const [dx,dy,px,py] = bounds;
    return box(x+f.x+dx,y+f.y+dy,px,py,top-bottom,color,bottom,1,group);
  }
  for (const u of [length*.12,length*.80]) {
    for (const v of [width*.09,width*.82]) part(u,v,length*.075,width*.09,0,clearance,trim);
  }
  part(0,0,length,width,clearance,platform,wood);
  const headboard = part(0,width*.02,length*.035,width*.96,platform,f.h,wood);
  const halfWidth = width*.96/200, halfHeight = (f.h-platform)/200;
  const radius = Math.min(.12,halfWidth*.4,halfHeight*.5);
  const outline = new three.Shape();
  outline.moveTo(-halfWidth,-halfHeight);
  outline.lineTo(halfWidth,-halfHeight);
  outline.lineTo(halfWidth,halfHeight-radius);
  outline.quadraticCurveTo(halfWidth,halfHeight,halfWidth-radius,halfHeight);
  outline.lineTo(-halfWidth+radius,halfHeight);
  outline.quadraticCurveTo(-halfWidth,halfHeight,-halfWidth,halfHeight-radius);
  outline.closePath();
  headboard.geometry.dispose();
  headboard.geometry = new three.ExtrudeGeometry(outline,{depth:length*.035/100,bevelEnabled:false});
  headboard.geometry.translate(0,0,-length*.035/200);
  headboard.rotation.y = (turns+1)*Math.PI/2;
  part(length*.045,width*.027,length*.925,width*.946,platform,mattress,f.c);
  part(length*.065,width*.30,length*.15,width*.40,mattress,mattress+f.h*.065,f.c);
}

function buildLivingSofa(f,[x,y],box,group) {
  const [px,py,h]=[f.x,f.y,f.h], turns=((f.turns||0)%4+4)%4;
  const [w,d]=turns%2 ? [f.d,f.w] : [f.w,f.d];
  const wood='#67412e', edge='#4f3225', seat='#79523e';
  function add(u,v,width,depth,bottom,top,color) {
    const [dx,dy,pxw,pyd]=[
      [u,v,width,depth],
      [d-v-depth,u,depth,width],
      [w-u-width,d-v-depth,width,depth],
      [v,w-u-width,depth,width]
    ][turns];
    return box(x+px+dx,y+py+dy,pxw,pyd,top-bottom,color,bottom,1,group);
  }
  for (const u of [7,w-15]) {
    for (const v of [8,d-13]) add(u,v,8,7,0,h*.22,edge);
  }
  add(2,4,w-4,d-7,h*.16,h*.41,wood);
  add(5,d-4,w-10,3,h*.20,h*.255,edge);
  const seatWidth=(w-20)/2;
  for (let i=0;i<2;i++) {
    const u=10+i*seatWidth;
    add(u+.35,12,seatWidth-.7,d-16,h*.40,h*.49,seat);
    const back=add(u+.35,3,seatWidth-.7,5,h*.47,h*.98,wood);
    const halfWidth=(seatWidth-.7)/200, halfHeight=h*.51/200, radius=.075;
    const outline=new three.Shape();
    outline.moveTo(-halfWidth,-halfHeight);
    outline.lineTo(halfWidth,-halfHeight);
    outline.lineTo(halfWidth,halfHeight-(i===1 ? radius : 0));
    if (i===1) outline.quadraticCurveTo(halfWidth,halfHeight,halfWidth-radius,halfHeight);
    outline.lineTo(-halfWidth+(i===0 ? radius : 0),halfHeight);
    if (i===0) outline.quadraticCurveTo(-halfWidth,halfHeight,-halfWidth,halfHeight-radius);
    outline.closePath();
    back.geometry.dispose();
    back.geometry=new three.ExtrudeGeometry(outline,{depth:.05,bevelEnabled:false});
    back.geometry.translate(0,0,-.025);
    back.rotation.x=-.13;
    back.rotation.y=turns*Math.PI/2;
  }
  for (const u of [0,w-9]) {
    add(u,7,9,d-11,h*.40,h*.58,wood);
    add(u,7,9,d-12,h*.58,h*.66,seat);
    add(u+1,d-10,7,5,h*.18,h*.64,edge);
  }
  const cushion=add(w*.38,d*.44,w*.20,d*.27,h*.49,h*.55,'#d8ccbb');
  cushion.rotation.y=.22;
}

function studioFurnitureParts(f,[x,y],box,group) {
  const turns=(f.turns || 0)%4;
  const [width,depth]=turns%2 ? [f.d,f.w] : [f.w,f.d];
  const angle=-turns*Math.PI/2;
  function part(u,v,w,d,bottom,top,color) {
    const [dx,dy,pw,pd]=[[u,v,w,d],[depth-v-d,u,d,w],
      [width-u-w,depth-v-d,w,d],[v,width-u-w,d,w]][turns];
    return box(x+f.x+dx,y+f.y+dy,pw,pd,top-bottom,color,bottom,1,group);
  }
  // Build curved faces in the item's local coordinates before rotating the assembly.
  function profile(u,v,w,d,bottom,top,color,arch=false) {
    const mesh=part(u,v,w,d,bottom,top,color);
    const hw=w/200,hh=(top-bottom)/200, radius=Math.min(hw,hh,arch ? hw : .028);
    const shape=new three.Shape();
    shape.moveTo(-hw,-hh); shape.lineTo(hw,-hh); shape.lineTo(hw,hh-radius);
    if (arch && radius===hw) shape.absarc(0,hh-radius,radius,0,Math.PI,false);
    else {
      shape.quadraticCurveTo(hw,hh,hw-radius,hh);
      shape.lineTo(-hw+radius,hh);
      shape.quadraticCurveTo(-hw,hh,-hw,hh-radius);
    }
    shape.closePath();
    mesh.geometry.dispose();
    mesh.geometry=new three.ExtrudeGeometry(shape,{depth:d/100,bevelEnabled:false,curveSegments:24});
    mesh.geometry.translate(0,0,-d/200);
    mesh.rotation.y=angle;
    return mesh;
  }
  return {width,depth,height:f.h,part,profile,angle};
}

function buildStudioSofa(f,origin,box,group) {
  if (f.sofaBed?.state==='expanded') {
    buildExpandedStudioSofa(f,origin,box,group);
    return;
  }
  const {width:w,depth:d,height:h,part,profile}=studioFurnitureParts(f,origin,box,group);
  const wood='#382921', beam='#4b3328', cushion='#d8cec2';
  const arm=w*.055, section=(w-2*arm)/3;
  part(arm,d*.08,w-2*arm,d*.87,h*.13,h*.39,beam);
  part(arm,0,w-2*arm,d*.13,h*.34,h*.79,wood);
  for (const u of [0,w-arm]) {
    part(u,d*.07,arm,d*.87,h*.42,h*.65,wood);
    for (const v of [d*.07,d*.84]) part(u,v,arm,d*.10,0,h*.43,wood);
  }
  profile(arm,d*.20,w-2*arm,d*.74,h*.38,h*.52,cushion);
  for (let i=0;i<3;i++) {
    const u=arm+i*section;
    profile(u+section*.012,d*.10,section*.976,d*.16,h*.50,h,cushion);
    profile(u+section*.045,d*.27,section*.91,d*.24,h*.52,h*.59,'#ede4d9');
  }
}

function buildExpandedStudioSofa(f,origin,box,group) {
  const {width:w,depth:d,height:h,part,profile}=studioFurnitureParts(f,origin,box,group);
  const rear=f.sofaBed.foldedDepth, extension=d-rear;
  const arm=w*.055, inner=w-2*arm, supportDepth=Math.min(d*.04,extension*.38);
  const wood='#382921', beam='#4b3328', cushion='#d8cec2';
  // Keep the original arm assembly and represent the sleeping surface over
  // two supported decks. This is a footprint study, with no assumed hardware.
  part(arm,0,inner,rear*.13,h*.34,h*.79,wood);
  for (const u of [0,w-arm]) {
    part(u,rear*.07,arm,rear*.87,h*.42,h*.65,wood);
    for (const v of [rear*.07,rear*.84]) part(u,v,arm,rear*.10,0,h*.43,wood);
  }
  part(arm,rear*.08,inner,rear*.92,h*.13,h*.37,beam);
  part(arm,rear,inner,extension,h*.22,h*.37,beam);
  for (const x of [arm, w-2*arm]) part(x,d-supportDepth,arm,supportDepth,0,h*.22,wood);
  const headInset=rear*.14, seam=Math.min(.8,extension*.15);
  profile(arm,headInset,inner,rear-headInset-seam,h*.37,h*.51,cushion);
  profile(arm,rear,inner,extension,h*.37,h*.51,cushion);
  profile(arm+inner*.25,headInset,inner*.50,Math.min(rear*.26,18),h*.51,h*.58,'#ede4d9');
}

function buildStudioMirror(f,origin,box,group) {
  const {width:w,depth:d,height:h,part,profile,angle}=studioFurnitureParts(f,origin,box,group);
  const metal='#b8bfc1', radius=Math.min(w*.019,d*.055,h*.018);
  const edge=w*.075, footY=radius*3.5, paneY=h*.10, faceDepth=d*.53;
  function tube(u,v,width,deep,bottom,top,axis) {
    const mesh=part(u,v,width,deep,bottom,top,metal);
    const length=axis==='vertical' ? top-bottom : axis==='width' ? width : deep;
    mesh.geometry.dispose();
    mesh.geometry=new three.CylinderGeometry(radius/100,radius/100,length/100,12);
    if (axis==='width') mesh.rotation.set(0,angle,Math.PI/2,'YXZ');
    if (axis==='depth') mesh.rotation.set(Math.PI/2,angle,0,'YXZ');
  }
  for (const u of [edge,w-edge-2*radius]) {
    tube(u,0,2*radius,d,footY-radius,footY+radius,'depth');
    tube(u,faceDepth-radius,2*radius,2*radius,footY,h*.57,'vertical');
    for (const v of [d*.08,d*.87]) part(u,v,2*radius,d*.06,0,footY-radius,'#303434');
  }
  tube(edge,d*.20,w-2*edge,2*radius,footY-radius,footY+radius,'width');
  profile(edge,faceDepth,w-2*edge,d*.065,paneY,h,'#777d7b',true);
  const glass=profile(edge+w*.016,faceDepth+d*.065,w-2*edge-w*.032,d*.022,paneY+h*.009,h-h*.009,f.c,true);
  glass.material.roughness=.18;
  glass.material.metalness=.38;
}

const bedroomCabinetProfiles = {
  'studio-l': {
    facing:'east', desktop:'north', ceilingBand:.24,
    bays:[{kind:'study',width:.15},{kind:'doors',width:.51,count:3,split:.40},
      {kind:'drawers',width:.34,count:2,rows:3,split:.39}]
  },
  'bed-wardrobe': {

    bays:[{kind:'doors',width:.46,count:3,split:.39},
      {kind:'drawers',width:.37,count:2,rows:3,split:.38},
      {kind:'rounded',width:.17,corner:'end'}]
  },
  'bed-desk': {facing:'east', ceilingBand:.34, standalone:true},
  'master-l': {

    bays:[{kind:'rounded',width:.17,corner:'start'},

function cabinetElevation(part,[ox,oy],facing,box,group) {
  const [px,py,w,d] = part.box;
  const x=ox+px, y=oy+py;
  const acrossY = facing === 'east' || facing === 'west';
  const span = acrossY ? d : w, depth = acrossY ? w : d;
  function point(u,v) {
    switch (facing) {
      case 'east': return [x+v,y+d-u];
      case 'west': return [x+w-v,y+u];
      case 'north': return [x+u,y+d-v];
      case 'south': return [x+w-u,y+v];
    }
  }
  function board(u,v,width,thickness,base,top,color,corner) {
    if (width<=0 || thickness<=0 || top<=base) return;
    const [ax,az]=point(u,v), [bx,bz]=point(u+width,v+thickness);
    const mesh=box(Math.min(ax,bx),Math.min(az,bz),Math.abs(bx-ax),Math.abs(bz-az),top-base,color,base,1,group);
    if (!corner) return mesh;
    const radius=Math.min(width*.4,thickness*.5,7);
    const shape=new three.Shape(), cx=(ax+bx)/2, cz=(az+bz)/2;
    const local=(a,b) => {const [gx,gz]=point(u+a,v+b); return [(gx-cx)/100,(cz-gz)/100];};
    shape.moveTo(...local(0,0));
    shape.lineTo(...local(width,0));
    shape.lineTo(...local(width,thickness-(corner==='end' ? radius : 0)));
    if (corner==='end') shape.quadraticCurveTo(...local(width,thickness),...local(width-radius,thickness));
    shape.lineTo(...local(corner==='start' ? radius : 0,thickness));
    if (corner==='start') shape.quadraticCurveTo(...local(0,thickness),...local(0,thickness-radius));
    shape.closePath();
    mesh.geometry.dispose();
    mesh.geometry=new three.ExtrudeGeometry(shape,{depth:(top-base)/100,bevelEnabled:false});
    mesh.geometry.translate(0,0,-(top-base)/200);
    mesh.rotation.x=-Math.PI/2;
    return mesh;
  }
  return {span,depth,board};
}

function buildBedroomCabinet(asset,origin,box,group) {
  const profile=bedroomCabinetProfiles[asset.id];
  const [body,returnDesk]=asset.parts;
  const elevation=cabinetElevation(body,origin,profile.facing,box,group);
  const {span,depth,board}=elevation;
  const wood='#614331', inside='#493225', face='#ece8dd';
  const top=body.height;
  const deskTop=profile.standalone ? previewGeometry.deskHeight : returnDesk?.height;
  const header=top*(1-profile.ceilingBand);
  const substrate=2, reveal=.65;
  const wallFace=previewGeometry.wallThickness/2+.5;
  function fronts(draw,depth,u,width,bottom,top,count) {
    const pitch=width/count;
    for(let i=0;i<count;i++) {
      draw(u+i*pitch+reveal/2,depth-2,pitch-reveal,2,bottom+reveal/2,top-reveal/2,face);
    }
  }
  function openBay(u,width,bottom,ceiling,levels,rounded) {
    board(u,wallFace,width,substrate,bottom,ceiling,inside);
    // A rounded exposed end has no full-depth side panel hiding the curve.
    const leftDepth=rounded==='start' ? depth*.45 : depth-2;
    const rightDepth=rounded==='end' ? depth*.45 : depth-2;
    board(u,wallFace+2,substrate,leftDepth-wallFace-2,bottom,ceiling,wood);
    board(u+width-substrate,wallFace+2,substrate,rightDepth-wallFace-2,bottom,ceiling,wood);
    for(const ratio of levels) {
      const height=bottom+(ceiling-bottom)*ratio;
      board(u,wallFace,width,depth-wallFace,height,height+2.4,wood,rounded);
    }
  }
  function desktop({board:draw,span:width,depth:reach},height,support,rounded) {
    draw(0,0,width,reach,height-3,height,wood,rounded);
    draw(0,wallFace,width,2,0,height-3,inside);
    if (support==='both' || support==='start') draw(0,2,2.5,reach-2,0,height-3,wood);
    if (support==='both' || support==='end') draw(width-2.5,2,2.5,reach-2,0,height-3,wood);
    draw(2.5,reach-14,width-5,12,height-13,height-3,inside);
    fronts(draw,reach,2.5,width-5,height-13,height-3,2);
  }

  if (profile.standalone) {
    desktop(elevation,deskTop,'both');
    openBay(0,span,deskTop,header,[.60]);
    board(0,0,span,depth-2,header,top-1.5,wood);
    fronts(board,depth,0,span,header,top-1.5,2);
    board(0,0,span,depth,top-1.5,top,wood);
    return;
  }

  let u=0;
  for (const bay of profile.bays) {
    const width=span*bay.width;
    board(u,0,width,depth-2,header,top-1.5,wood);
    fronts(board,depth,u,width,header,top-1.5,bay.count ?? 1);
    if (bay.kind==='rounded') {
      openBay(u,width,4,header,[0,.18,.36,.79],bay.corner);
      board(u,0,width,depth,0,4,wood,bay.corner);
    } else if (bay.kind==='study') {
      openBay(u,width,deskTop,header,[.34,.68]);
      board(u,0,width,depth,deskTop-3,deskTop,wood);
      board(u,wallFace,width,2,0,deskTop-3,inside);
      board(u,2,2,depth-2,0,deskTop-3,wood);
      board(u+width-2,2,2,depth-2,0,deskTop-3,wood);
    } else {
      const split=top*bay.split;
      board(u,0,width,depth-2,4,header,inside);
      board(u,0,width,depth-1,0,4,wood);
      fronts(board,depth,u,width,split,header,bay.count);
      if (bay.kind==='drawers') {
        const pitch=(split-4)/bay.rows;
        for(let i=0;i<bay.rows;i++) fronts(board,depth,u,width,4+i*pitch,4+(i+1)*pitch,1);
      } else {
        fronts(board,depth,u,width,4,split,bay.count);
      }
    }
    u+=width;
  }
  board(0,0,span,depth,top-1.5,top,wood);
  if (returnDesk) {
    const end=profile.desktop==='north' ? 'end' : 'start';
    desktop(cabinetElevation(returnDesk,origin,profile.desktop,box,group),deskTop,end,end);
  }
}

async function build3() {
  try {
    loading3d ??= initialize3d();
    await loading3d;
    if (mode !== '3') return;
    if (model) {
      scene.remove(model);
      model.traverse(node => {
        if (!node.isMesh) return;
        node.geometry.dispose();
        node.material.dispose();
      });
    }
    wallLayers = [];
    model = new three.Group();
    scene.add(model);
    const [ox,oy,w,h] = viewBox();
    function box(x,y,width,depth,height,color,base=0,opacity=1,parent=model) {
      if (width <= 0 || depth <= 0 || height <= 0) return;
      const mesh = new three.Mesh(new three.BoxGeometry(width/100,height/100,depth/100),
        new three.MeshStandardMaterial({color,opacity,transparent:opacity < 1,roughness:.78}));
      mesh.position.set((x+width/2-ox-w/2)/100,(base+height/2)/100,(y+depth/2-oy-h/2)/100);
      parent.add(mesh);
      return mesh;
    }
    for (const key of roomKeys()) {
      const [x,y,width,depth] = plan.rooms[key].box;
      box(x,y,width,depth,4,'#f2f1ee',-4);
      for (const f of furniture(key)) {
        const group=new three.Group();
        group.userData.furniture={room:key,id:f.id};
        model.add(group);
        if (f.model === 'photo-bed') buildPhotoBed(f,x,y,box,group);
        else if (f.model === 'photo-sofa') buildLivingSofa(f,[x,y],box,group);
        else if (f.model === 'photo-studio-sofa') buildStudioSofa(f,[x,y],box,group);
        else if (f.model === 'photo-studio-mirror') buildStudioMirror(f,[x,y],box,group);
        else box(x+f.x,y+f.y,f.w,f.d,f.h,f.c,0,1,group);

      }
      for (const asset of plan.fixed.filter(a => a.room === key)) {
        if (asset.cabinet) {
          const cabinet = new three.Group();
          cabinet.name = asset.id;
          model.add(cabinet);
          if (asset.cabinet === 'media-wall') buildMediaWall(asset,[x,y],box,cabinet);
          else buildDiningCabinet(asset,[x,y],box,cabinet);
          continue;
        }
        if (bedroomCabinetProfiles[asset.id]) {
          const cabinet = new three.Group();
          cabinet.name = asset.id;
          model.add(cabinet);
          buildBedroomCabinet(asset,[x,y],box,cabinet);
          continue;
        }
        // The hall cabinet retains its existing elevation.
        const [{box:[px,py,pw,pd],height}] = asset.parts;
        const cx=x+px, cy=y+py;
        box(cx+1,cy+1,pw-2,pd-2,6,'#554237');
        box(cx,cy+2,pw,pd-2,height-6,'#655344',6);
        box(cx+1,cy,pw-2,2,height*.40-7,'#ebe7df',7);
        box(cx+1,cy+2,pw-2,8,2,'#70513e',height*.40);
        box(cx+1,cy,pw-2,2,height*.38-1,'#ebe7df',height*.62);
      }
    }
    for (const wall of visibleWalls()) {
      const horizontal = wall.axis === 'h';
      const min = horizontal ? ox : oy;
      const max = min + (horizontal ? w : h);
      const normalCenter = horizontal ? oy+h/2 : ox+w/2;
      const sides = new Set(wall.rooms.filter(key => current === 'all' || key === current).map(key => {
        const [x,y,width,depth] = plan.rooms[key].box;
        const roomCenter = horizontal ? y+depth/2 : x+width/2;
        return Math.sign(wall.at-roomCenter);
      }));
      const upper = new three.Group(), lower = new three.Group();
      model.add(upper,lower);
      wallLayers.push({segment:wall,axis:wall.axis,side:sides.size === 1 ? [...sides][0] : 0,
        plane:(wall.at-normalCenter)/100,upper,lower});
      const {wallHeight,wallThickness,cutHeight,doorTop,windowSill,windowTop,frameWidth} = previewGeometry;
      function strip(group,a,b,base,top,thickness,color,offset=0,opacity=1) {
        const from = Math.max(a,min), to = Math.min(b,max);
        if (to <= from) return;
        const [x,y] = point(wall,from,offset-thickness/2);
        const [width,depth] = horizontal ? [to-from,thickness] : [thickness,to-from];
        box(x,y,width,depth,top-base,color,base,opacity,group);
      }
      function masonry(group,a,b,base,top) {
        strip(group,a,b,base,top,wallThickness,'#e8e2d8');
      }
      for (const [a,b] of segments(wall)) {
        masonry(upper,a,b,0,wallHeight);
        masonry(lower,a,b,0,cutHeight);
        strip(upper,a,b,0,6,wallThickness+1,'#c9bdab');
      }
      for (const opening of wall.openings) {
        const {from,to,type} = opening;
        const window = type === 'window';
        const sliding = slidingType(opening);
        const glass = window || type === 'sliding-glass-door';
        const sill = opening.floorSlider?.sill ?? (window ? windowSill : 0);
        const head = opening.floorSlider?.head ?? (window ? windowTop : doorTop);
        masonry(upper,from,to,0,sill);
        masonry(upper,from,to,head,wallHeight);
        if (window) masonry(lower,from,to,0,cutHeight);
        if (type === 'passage') continue;

        if (opening.floorSlider) {
          buildFloorSlider(wall,opening,strip);
          continue;
        }
        const frame = glass ? '#475e61' : '#766854';
        strip(upper,from,from+frameWidth,sill,head,8,frame);
        strip(upper,to-frameWidth,to,sill,head,8,frame);
        strip(upper,from,to,head-frameWidth,head,8,frame);
        if (window) strip(upper,from,to,sill,sill+frameWidth,12,frame);
        if (glass || sliding) {
          const panel = glass ? '#76adc0' : '#b2a18a';
          strip(upper,from+frameWidth,to-frameWidth,sill+frameWidth,head-frameWidth,
            2,panel,0,glass ? .42 : 1);
          if (sliding) {
            strip(lower,from,to,0,cutHeight,2,panel,0,glass ? .42 : 1);
            for (const group of [upper,lower]) {
              strip(group,from,to,0,3,1.5,frame,-5);
              strip(group,from,to,0,3,1.5,frame,5);
            }
          }
        }
      }
    }
    for (const key of roomKeys()) {
      const detail=sceneDetails[key];
      if (!detail) continue;
      const group=new three.Group();
      group.name=detail.id;
      model.add(group);
      buildEntryClock(detail,viewBox(),group,wallLayers);
    }
    size3d();
    restoreRoomCamera();
    updateFurnitureHighlight();
    updateWallVisibility();
    $('status').textContent = '3D 示意已加载';
  } catch {
    loading3d = null;
    $('status').textContent = '3D 加载失败，可继续查看 2D';
  }
}

function assetStore(mode, operation) {
  return new Promise((resolve,reject)=>{
    const transaction=assetDatabase.transaction('furniture',mode);

    transaction.oncomplete=()=>resolve(request.result);

async function thumbnail(file) {
  if (!['image/jpeg','image/png','image/webp'].includes(file.type) || file.size>20*1024*1024)
    throw new Error('请选择 20 MB 以内的 JPG、PNG 或 WebP 照片。');
  let image;
  try {
    image=await createImageBitmap(file,{imageOrientation:'from-image'});
    const scale=Math.min(1,640/Math.max(image.width,image.height));
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(image.width*scale));
    canvas.height=Math.max(1,Math.round(image.height*scale));
    canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',.82));
    if(!blob) throw new Error();
    return blob;
  } catch {
    throw new Error('无法读取或缩小这张照片，请换一张后重试。');
  } finally {
    image?.close();
  }
}

  const wall = plan.walls.find(w => w.openings.some(o => o.floorSlider));
  const door = wall.openings.find(o => o.floorSlider);
  if (!camera || frameKey !== 'kitchen') return;
  const [ox,oy,w,h] = viewBox();
  const [x,z] = point(wall,(door.from+door.to)/2);
  const [cx,cz] = [(x-ox-w/2)/100,(z-oy-h/2)/100];
  const cy = door.floorSlider.head/200;
  controls.target.set(cx,cy,cz);
  camera.position.set(cx-3.5,cy+.11,cz);
  $('walls').value = 'full';
  controls.update();
  updateWallVisibility();
};
$('b2').onclick = () => setMode('2');
$('b3').onclick = () => setMode('3');
window.addEventListener('resize',size3d);
setMode('2');
</script></body></html>
