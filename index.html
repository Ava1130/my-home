<script>
'use strict';
const $ = id => document.getElementById(id);

// Coordinates in cm. Polygons, opening extents and cabinet parts are provisional
// drawing geometry. Reference dimensions are recorded separately from that geometry.
const plan = {
  bounds: [1350, 790],

  walls: [],

    {id:'bed-wardrobe', room:'bed', name:'衣柜及圆角开放格', parts:[{box:[322,0,78,184], label:'衣柜', height:250}]},
    {id:'bed-desk', room:'bed', name:'独立开放格书桌及吊柜', parts:[{box:[0,190,55,100], label:'书桌', desk:true, height:220}]},

    {id:'entry-low', room:'dining', name:'玄关矮柜', cabinet:'sideboard', facing:'up',

        {box:[364,306.5,40,37], label:'展示柜', height:246}

  ]
};

// Each wall is entered once, with openings measured along its axis.
// Door handing is taken from the plan where shown; opening extents are provisional.
function wall(axis, at, from, to, rooms, openings = []) {
  plan.walls.push({axis, at, from, to, rooms, openings});
}
const opening = (type, from, to, swing = 0, hinge = 'start') => ({type, from, to, swing, hinge});
wall('h',0,410,810,['bed'],[opening('window',512,665)]);
wall('h',0,810,1230,['master']);
wall('v',410,0,290,['bed']);
wall('v',810,0,290,['bed','master']);
wall('v',1230,0,290,['master'],[opening('window',42,199)]);
wall('h',290,410,700,['bed','bath']);
wall('h',290,700,810,['bed','hall'],[opening('door',708,810,-1,'end')]);
wall('h',290,810,920,['master','hall'],[opening('door',810,912,-1)]);
wall('h',290,920,1230,['master','kitchen']);
wall('v',410,290,440,['bath'],[opening('window',339,390)]);

wall('v',920,290,440,['hall','kitchen'],[
  {type:'sliding-glass-door', from:290, to:371, id:'kitchen-glass-slider',
    // Opening width/position retained; height and one leaf's travel are preview assumptions.
    floorSlider:{sill:0, head:240, jamb:2, rail:1.5, frame:1.8, leafFraction:.55, trackOffset:5}}
]);
wall('v',1230,290,440,['kitchen'],[opening('window',302,396)]);
wall('h',440,0,410,['studio'],[opening('window',117,281)]);
wall('h',440,410,700,['bath','dining']);
wall('h',440,700,920,['hall','dining','living'],[opening('passage',700,800)]);

wall('h',440,1230,1350,['balcony'],[opening('window',1260,1303)]);
wall('v',0,440,790,['studio']);
wall('v',410,440,790,['studio','dining'],[opening('door',690,780,-1,'end')]);
wall('v',1230,440,790,['living','balcony'],[opening('sliding-glass-door',447,621),opening('sliding-glass-door',625,785)]);
wall('v',1350,440,790,['balcony'],[opening('window',462,730)]);
wall('h',790,0,410,['studio']);
wall('h',790,410,810,['dining'],[opening('door',445,534,-1)]);

wall('h',790,1230,1350,['balcony'],[opening('window',1251,1305)]);

// Evidence is independent of layout geometry: a local measurement never
// replaces a room dimension or a saved furniture adjustment.
const calibration = {
  revision: 3,
  living: [{object:'living-photo-sofa',field:'appearance',status:'confirmed',source:'PUBLIC-05–08',
    detail:'木沙发靠阳台一侧的客厅墙、面朝电视；外廓与离墙距离暂定'}],
  dining: [{object:'entry-wall-clock',field:'appearance',status:'confirmed',source:'PUBLIC-09',
    detail:'玄关矮柜上方的扇形壁钟；图案为照片近似，挂高及尺寸暂定'}],
  studio: [{object:'studio-l',field:'elevation',status:'confirmed',source:'P2–P3 / P10',
    detail:'固定 L 型书桌与衣柜相接，开放格只在书桌端；分段比例与尺寸暂定'}],
  master: [{object:'master-l',field:'elevation',status:'confirmed',source:'P13–P14 / P12',
    detail:'左端圆角开放架，右端开放格接固定书桌；两侧结构不对称，分段尺寸暂定'}],
  bed: [
    {object:'bed-wardrobe',field:'elevation',status:'confirmed',source:'P8 / P9',
      detail:'右端圆角开放架、浅色主体及下部抽屉组；分段尺寸暂定'},
    {object:'bed-desk',field:'elevation',status:'confirmed',source:'P5–P6',
      detail:'浅色双门上柜、深木开放格和落地侧背板；分段尺寸暂定'},
    {object:'photo-bed', field:'appearance', status:'confirmed', source:'BED-12',
      detail:'木床架、圆角木床头、蓝色床垫，床头靠独立书桌所在墙'},
    {object:'photo-bed', field:'underframeClearance', status:'provisional', source:'BED-10',
      value:15, detail:'图注 15，当前按厘米表现，单位待确认'},
    {object:'photo-bed', field:'overallSizeAndOffset', status:'provisional', source:'BED-05 / BED-11 / BED-12',
      detail:'床架、床垫外廓与贴墙距离暂按照片示意'},
    {object:'bed-desk', field:'drawerFaces', status:'confirmed', source:'BED-09',
      value:2, detail:'深木色柜身和台面、两片白色抽面'},
    {object:'bed-desk', field:'floorMarks', status:'pending', source:'BED-09',
      detail:'78.4 / 42 的单位及端点待确认，未用于替换外廓'},
    {object:'bed-wall-return', field:'floorMarks', status:'pending', source:'BED-11',
      detail:'19 / 22 / 43 为床旁局部标注，墙线与端点仍待确认'}
  ]
};
const referenceBed = {id:'reference-bed', model:'photo-bed', n:'实拍木床与床垫',
  x:8,y:45,w:205,d:140,h:95,c:'#33577c',turns:0};

const retiredStudioPlaceholders = [
  {id:1,n:'沙发床',x:135,y:20,w:145,d:80,h:80,c:'#c9b6a4'},
  {id:2,n:'升降桌',x:310,y:100,w:65,d:130,h:75,c:'#795f4a'},
  {id:3,n:'父亲电脑桌',x:165,y:275,w:100,d:55,h:75,c:'#b7b7b7'}
];
const referenceLivingSofa = {id:'living-photo-sofa',model:'photo-sofa',n:'客厅木沙发',
  x:163,y:7,w:223,d:82,h:91,c:'#67412e',turns:0};
const defaults = {bed:[referenceBed],living:[referenceLivingSofa]};
const storageKey = 'myhome-v41';
const slots = ['A','B','C'];

function loadLayouts() {
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey));
    if (saved?.version === 2 && saved.rooms) return saved;
    // Preserve old A/B/C user layouts while migrating the formerly 3D-only
    // photographed sofa into the shared editable furniture records.
    if (saved?.version === 1 && saved.rooms) {
      const room=saved.rooms.living;
      if (room) {
        const addIfMissing=items=>{
          if (Array.isArray(items) && !items.some(item=>item.id===referenceLivingSofa.id))
            items.push(structuredClone(referenceLivingSofa));
        };
        addIfMissing(room.baseline);
        for (const items of Object.values(room.variants || {})) addIfMissing(items);
      }
      saved.version=2;
      return saved;
    }
  } catch {}
  let legacy;
  try { legacy = JSON.parse(localStorage.getItem('myhome-v32')); } catch {}
  const source = legacy?.f || defaults;
  const rooms = {};
  for (const room of Object.keys(plan.rooms)) {
    let baseline = Array.isArray(source[room]) ? structuredClone(source[room]) : [];
    // Keep the real sofa in a living room migrated from legacy v3.2 as well.
    if (room === 'living' && !baseline.some(item=>item.id===referenceLivingSofa.id)) baseline.push(structuredClone(referenceLivingSofa));
    if (room === 'studio') baseline = baseline.filter(item => !retiredStudioPlaceholders.some(placeholder =>
      Object.keys(item).length === Object.keys(placeholder).length &&
      Object.entries(placeholder).every(([field,value]) => item[field] === value)));
    rooms[room] = {baseline, active:'A', variants:{A:structuredClone(baseline)}};
  }
  return {version:2,rooms};
}

const data = loadLayouts();
const histories = new Map();
let current = 'all', selected = null, mode = '2';
let renderer, scene, camera, controls, model, loading3d, three, frameKey;
let planZoom=1;
const zoomClamp = value => Math.max(.5,Math.min(3,Math.round(value*10)/10));
function setPlanZoom(value) { planZoom=zoomClamp(value); if(mode==='2') draw(); }
function updateZoomControls(){
  const is2d=mode==='2';
  for(const id of ['zoomout','zoomin','zoomvalue']) $(id).hidden=!is2d;
  $('zoomvalue').textContent=Math.round(planZoom*100)+'%';
  $('zoomout').disabled=!is2d||planZoom<=.5;
  $('zoomin').disabled=!is2d||planZoom>=3;
}
const roomKeys = () => current === 'all' ? Object.keys(plan.rooms) : [current];
const viewBox = () => current === 'all' ? [0,0,...plan.bounds] : plan.rooms[current].box;
const visibleWalls = () => plan.walls.filter(w => current === 'all' || w.rooms.includes(current));
const furniture = key => {
  const room=data.rooms[key];
  return room?.variants[room.active] ?? [];
};
const selectedItem = () => furniture(current).find(f => f.id === selected);
const label = room => room.name + ' · ' + room.area.toFixed(1) + '㎡';
const escape = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);

function save() {
  const indicator=$('saveStatus');
  try {
    localStorage.setItem(storageKey,JSON.stringify(data));
    delete indicator.dataset.failed;
    indicator.textContent='已保存到本机';
  } catch {
    indicator.dataset.failed='';
    indicator.textContent='未保存 · 可点击保存重试';
  }
}

function roomHistory(key) {
  const layout=data.rooms[key];
  if (!layout) return null;
  const id=key+':'+layout.active;
  if (!histories.has(id)) histories.set(id,{undo:[],redo:[]});
  return histories.get(id);
}

function snapshot(key) {
  return {items:structuredClone(furniture(key)),selected:current===key ? selected : null};
}

function commitEdit(key,before) {
  if (JSON.stringify(before.items)===JSON.stringify(furniture(key))) return;
  const {undo,redo}=roomHistory(key);
  undo.push(before);
  if (undo.length>60) undo.shift();
  redo.length=0;
  save();
}

function applyEdit(change) {
  const before=snapshot(current);
  change();
  commitEdit(current,before);
  sync();
}

function navigateHistory(direction) {
  const layout=data.rooms[current], history=roomHistory(current);
  const next=history?.[direction].pop();
  if (!next) return;
  history[direction==='undo' ? 'redo' : 'undo'].push(snapshot(current));
  layout.variants[layout.active]=next.items;
  selected=next.selected;
  save();
  sync();
}

function setPosition(item,key,x,y) {
  const [, ,width,depth]=plan.rooms[key].box;
  const within=(value,max)=>Math.round(Math.max(0,Math.min(max,value))*10)/10;
  item.x=within(x,width-item.w);
  item.y=within(y,depth-item.d);
}

function segments(w) {
  const solid = [];
  let start = w.from;
  for (const o of w.openings) {
    if (o.from > start) solid.push([start, o.from]);
    start = o.to;
  }
  if (start < w.to) solid.push([start, w.to]);
  return solid;
}

function point(w, along, offset = 0) {
  return w.axis === 'h' ? [along,w.at + offset] : [w.at + offset,along];
}

function line(w, a, b, css, offset = 0) {
  const [x1,y1] = point(w,a,offset), [x2,y2] = point(w,b,offset);
  return `<line class="${css}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
}

let kitchenSlide = 0;
function floorSliderLayout(o) {
  const {jamb,leafFraction} = o.floorSlider;
  const start = o.from+jamb, end = o.to-jamb;
  const leafWidth = (end-start)*leafFraction;
  return {start,end,leafWidth,travel:end-start-leafWidth};
}

const slidingType = o => ['sliding-door','sliding-glass-door'].includes(o.type);

function openingMark(w, o) {
  if (o.type === 'passage') return line(w,o.from,o.to,'passage-line');
  if (slidingType(o)) {
    const glass = o.type === 'sliding-glass-door';
    const name = glass ? '推拉玻璃门' : '推拉门';
    if (o.floorSlider) {
      const {start,leafWidth,travel} = floorSliderLayout(o);
      const leaf = start+travel*kitchenSlide;
      const {trackOffset} = o.floorSlider;
      return `<g data-opening="${o.type}" data-opening-id="${o.id}"><title>落地玻璃推拉门 · 位置及洞口宽度沿用 · 高度、门扇宽度和行程暂定</title>` +
        line(w,o.from,o.to,'slider-track',-trackOffset) + line(w,o.from,o.to,'slider-track',trackOffset) +
        line(w,leaf,leaf+leafWidth,'slider-panel glass') + '</g>';
    }
    // An unsegmented band represents the other sliding assemblies.
    return `<g data-opening="${o.type}"${o.id ? ` data-opening-id="${o.id}"` : ''}><title>${name}示意 · 门扇数量、滑动方向及精确尺寸待确认</title>` +
      line(w,o.from,o.to,'slider-panel' + (glass ? ' glass' : '')) +
      line(w,o.from,o.to,'slider-track',-6) + line(w,o.from,o.to,'slider-track',6) + '</g>';
  }
  if (o.type !== 'door') {
    return line(w,o.from,o.to,'opening-line',-4) + line(w,o.from,o.to,'opening-line',4);
  }
  const fromStart = o.hinge === 'start';
  const hinge = fromStart ? o.from : o.to, free = fromStart ? o.to : o.from;
  const width = o.to - o.from;
  const [hx,hy] = point(w,hinge), [fx,fy] = point(w,free);
  const [lx,ly] = point(w,hinge,width * o.swing);
  const sweep = (fx-hx)*(ly-hy) - (fy-hy)*(lx-hx) > 0 ? 1 : 0;
  return `<path class="door-leaf" d="M${hx} ${hy}L${lx} ${ly}M${fx} ${fy}A${width} ${width} 0 0 ${sweep} ${lx} ${ly}"/>`;
}

function fixedMark(asset) {
  const [ox,oy] = plan.rooms[asset.room].box;
  const labelClass = asset.facing === 'right' || asset.cabinet === 'media-wall' ? ' fixed-label-vertical' : '';
  return `<g data-fixed="${asset.id}" transform="translate(${ox} ${oy})"><title>${asset.name} · 固定 · 尺寸暂定</title>` +
    asset.parts.map(({box:[x,y,w,h],label,desk}) =>
      `<rect class="fixed-part${desk ? ' desk' : ''}${asset.cabinet ? ' photo-cabinet' : ''}" x="${x}" y="${y}" width="${w}" height="${h}"/><text class="fixed-label${w<h ? labelClass : ''}" x="${x+w/2}" y="${y+h/2+4}">${label}</text>`).join('') + '</g>';
}

function draw() {
  const [x,y,w,h] = viewBox(), pad = current === 'all' ? 30 : 35;
  const baseW=w+2*pad,baseH=h+2*pad;
  const shownW=baseW/planZoom,shownH=baseH/planZoom;
  const viewX=x+w/2-shownW/2,viewY=y+h/2-shownH/2;
  const keys = roomKeys();
  const fills = keys.map(key => {
    const [rx,ry,rw,rh] = plan.rooms[key].box;
    return `<rect class="room${current === key ? ' active' : ''}" data-room="${key}" x="${rx}" y="${ry}" width="${rw}" height="${rh}"/>`;
  });
  const walls = visibleWalls().map(wall => segments(wall).map(([a,b]) => line(wall,a,b,'wall-segment')).join('') +
    wall.openings.map(o => openingMark(wall,o)).join(''));
  const labels = keys.map(key => {
    const room = plan.rooms[key], [rx,ry,rw,rh] = room.box;
    return `<text class="roomname" x="${rx+rw/2}" y="${ry+rh/2-5}">${room.name}</text><text class="area" x="${rx+rw/2}" y="${ry+rh/2+19}">${room.area.toFixed(1)}㎡</text>`;
  });
  const movable = keys.flatMap(key => {
    const [ox,oy] = plan.rooms[key].box;
    return furniture(key).map(f => `<g class="furniture${current === key && selected === f.id ? ' selected' : ''}" data-id="${f.id}" data-owner="${key}" transform="translate(${ox+f.x} ${oy+f.y})"><rect width="${f.w}" height="${f.d}" rx="3" fill="${escape(f.c)}"/><text x="6" y="17">${escape(f.n)}</text></g>`);
  });
  $('plan').innerHTML = `<svg role="img" aria-label="住宅平面图，细部尺寸暂定" preserveAspectRatio="xMidYMid meet" viewBox="${viewX} ${viewY} ${shownW} ${shownH}">${[
    ...fills,...labels,...movable,...plan.fixed.filter(asset => keys.includes(asset.room)).map(fixedMark),...walls
  ].join('')}</svg>`;
  $('plan').querySelectorAll('[data-room]').forEach(el => {
    el.onclick = () => { if (current === 'all') selectRoom(el.dataset.room); };
  });
  $('plan').querySelectorAll('[data-id]').forEach(el => { el.onpointerdown = event => dragFurniture(event,el); });
  updateZoomControls();
}

function dragFurniture(event, el) {
  if (event.button!==0 || !event.isPrimary) return;
  event.preventDefault();
  const key=el.dataset.owner;
  const f=furniture(key).find(item=>String(item.id)===el.dataset.id);
  if (!f) return;
  const before=snapshot(key), svg=el.ownerSVGElement;
  const [ox,oy]=plan.rooms[key].box;
  const local=e=>new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());
  const start=local(event), originalX=f.x, originalY=f.y;
  let nextX=originalX, nextY=originalY, moved=false;
  svg.querySelector('.furniture.selected')?.classList.remove('selected');
  el.classList.add('selected');
  el.setPointerCapture(event.pointerId);
  el.onpointermove=e=>{
    if (e.pointerId!==event.pointerId || (!moved && Math.hypot(e.clientX-event.clientX,e.clientY-event.clientY)<3)) return;
    moved=true;
    const pos=local(e), next={w:f.w,d:f.d};
    setPosition(next,key,originalX+pos.x-start.x,originalY+pos.y-start.y);
    ({x:nextX,y:nextY}=next);
    el.setAttribute('transform',`translate(${ox+nextX} ${oy+nextY})`);
  };
  function finish(e) {
    if (e.pointerId!==event.pointerId) return;
    el.onpointermove=el.onpointerup=el.onpointercancel=el.onlostpointercapture=null;
    if (e.type==='pointerup') {
      if (moved) {
        f.x=nextX;
        f.y=nextY;
        commitEdit(key,before);
      }
      selectRoom(key,f.id);
    } else sync();
  }
  el.onpointerup=el.onpointercancel=el.onlostpointercapture=finish;
}

function selectRoom(key, id = null) {
  if(current!==key) planZoom=1;
  current = key;
  selected = id;
  $('room').value = key;
  sync();
}

function sync() {
  const room = plan.rooms[current], f = selectedItem(), layout=data.rooms[current];
  $('schemes').hidden=!layout;
  if (layout) {
    $('scheme').replaceChildren(...slots.map(slot=>new Option('方案 '+slot+(layout.variants[slot] ? '' : ' · 新建'),slot)));
    $('scheme').value=layout.active;
    $('copyScheme').disabled=slots.every(slot=>layout.variants[slot]);
  }
  const history=roomHistory(current);
  $('undo').disabled=!history?.undo.length;
  $('redo').disabled=!history?.redo.length;
  $('kitchenslide').hidden = !['kitchen','hall'].includes(current);
  $('kitchenfront').hidden = mode !== '3' || current !== 'kitchen';
  $('roomdims').innerHTML = room
    ? `<p><strong>图纸面积 ${room.area.toFixed(1)}㎡</strong></p><p>${plan.provisional}</p>` +
      (room.photo ? `<p>照片局部测线<br>${room.photo}</p>` : '') +
      (['kitchen','hall'].includes(current) ? '<p>厨房落地玻璃推拉门 · 高度、门扇宽度与左右行程暂定</p>' : '') +
      plan.fixed.filter(a => a.room === current)
        .map(a => `<p>${a.name} · ${a.pending || '位置已核对，尺寸暂定'}</p>`).join('')
    : `<p>${plan.provisional}</p><p>图纸横向区段 ${plan.drawingDimensions.horizontal.bottom.map(v => (v/100).toFixed(1)).join(' / ')} m</p><p>图纸纵向区段 ${plan.drawingDimensions.vertical.map(v => (v/100).toFixed(1)).join(' / ')} m</p>`;
  if (calibration[current]) {
    $('roomdims').insertAdjacentHTML('beforeend',calibration[current].map(({status,source,detail}) => {
      const label = {confirmed:'已确认',provisional:'暂定',pending:'待确认'}[status];
      return `<p><strong>${label}</strong> · ${detail} <small>(${source})</small></p>`;
    }).join(''));
  }
  $('addReferenceBed').hidden = current !== 'bed' || furniture('bed').some(f => f.model === 'photo-bed');
  $('editor').hidden = !room;
  $('add').disabled = $('reset').disabled = !room;
  $('items').replaceChildren(new Option('选择活动家具',''), ...furniture(current).map(o => new Option(o.n,o.id)));
  $('items').value = selected ?? '';
  for (const [id,key] of Object.entries({name:'n',fw:'w',fd:'d',fh:'h',fx:'x',fy:'y',color:'c'})) {
    $(id).disabled = !f;
    $(id).value = f?.[key] ?? '';
  }
  $('rotate').disabled = $('remove').disabled = !f;
  if (mode === '2') draw();
  else build3();
}

function setMode(next) {
  mode = next;
  $('plan').style.display = next === '2' ? 'block' : 'none';
  $('three').style.display = next === '3' ? 'block' : 'none';
  $('b2').classList.toggle('active', next === '2');
  $('b3').classList.toggle('active', next === '3');
  $('walls').hidden = next !== '3';
  $('legend').querySelector('small').textContent = next === '3'
    ? '3D 可选中家具 · 拖动请切到 2D · 墙高、墙厚和开口细部暂定 · 推拉门扇数量与方向待确认' : '推拉门为示意，门扇数量、方向及尺寸待确认';
  updateZoomControls();
  sync();
}

function bind3dFurnitureSelection(canvas,THREE) {
  const ray=new THREE.Raycaster();
  let start;
  canvas.addEventListener('pointerdown',e=>{
    start=e.isPrimary && e.button===0 ? {id:e.pointerId,x:e.clientX,y:e.clientY,moved:false} : null;
  });
  canvas.addEventListener('pointermove',e=>{
    if (start?.id===e.pointerId && Math.hypot(e.clientX-start.x,e.clientY-start.y)>4) start.moved=true;
  });
  canvas.addEventListener('pointercancel',()=>{start=null;});
  canvas.addEventListener('pointerup',e=>{
    const click=start;
    start=null;
    if (!model || click?.id!==e.pointerId || click.moved || Math.hypot(e.clientX-click.x,e.clientY-click.y)>4) return;
    const bounds=canvas.getBoundingClientRect();
    ray.setFromCamera(new THREE.Vector2((e.clientX-bounds.x)/bounds.width*2-1,1-(e.clientY-bounds.y)/bounds.height*2),camera);
    const hit=ray.intersectObject(model,true).find(({object})=>{
      for(let node=object;node;node=node.parent) if (!node.visible) return false;
      return true;
    });
    const item=hit?.object.parent?.userData.furniture;
    if (item) selectRoom(item.room,item.id);
  });
}

async function initialize3d() {
  const [THREE,{OrbitControls}] = await Promise.all([
    import('https://esm.sh/three@0.164.1'),
    import('https://esm.sh/three@0.164.1/examples/jsm/controls/OrbitControls.js')
  ]);
  three = THREE;
  const host = $('three');
  const nextRenderer = new THREE.WebGLRenderer({antialias:true});
  nextRenderer.setPixelRatio(Math.min(devicePixelRatio || 1,2));
  host.replaceChildren(nextRenderer.domElement);
  bind3dFurnitureSelection(nextRenderer.domElement,THREE);
  renderer = nextRenderer;
  scene = new THREE.Scene();
  scene.background = new THREE.Color('#f7f7f7');
  camera = new THREE.PerspectiveCamera(45,1,.05,200);
  controls = new OrbitControls(camera,renderer.domElement);
  controls.enableDamping = true;
  scene.add(new THREE.HemisphereLight(0xffffff,0x9e9183,1.55));
  const light = new THREE.DirectionalLight(0xfff3e3,2.05);
  light.position.set(4,9,5);
  scene.add(light);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  controls.minDistance = 1;
  controls.maxDistance = 70;
  controls.maxPolarAngle = Math.PI * .49;
  renderer.setAnimationLoop(() => {
    if (mode === '3') {
      controls.update();
      updateWallVisibility();
      renderer.render(scene,camera);
    }
  });
}

function size3d() {
  if (!renderer || mode !== '3') return;
  const {clientWidth:w,clientHeight:h} = $('three');
  if (!w || !h) return;
  renderer.setSize(w,h);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}

// Display assumptions in centimetres. The 2D footprints and measured notes
// remain in plan; no value here represents a new measurement of the home.
const previewGeometry = {
  wallHeight:260, wallThickness:13, cutHeight:35, doorTop:210,
  windowSill:88, windowTop:210, frameWidth:4, deskHeight:76
};
let wallLayers = [];
$('walls').onchange = updateWallVisibility;

function updateWallVisibility() {
  if (!camera) return;
  const mode = $('walls').value;
  for (const {axis,side,plane,upper,lower} of wallLayers) {
    const coordinate = axis === 'h' ? camera.position.z : camera.position.x;
    const cut = mode === 'low' || (mode === 'auto' && side !== 0 && (coordinate-plane)*side > 0);
    upper.visible = !cut;
    lower.visible = cut;
  }
}

function frame3d() {
  const [, , w,h] = viewBox();
  const targetHeight = .6;
  const radius = Math.hypot(w/200, h/200, previewGeometry.wallHeight/100-targetHeight);
  const vertical = three.MathUtils.degToRad(camera.fov/2);
  const halfAngle = Math.min(vertical, Math.atan(Math.tan(vertical)*camera.aspect));
  const distance = radius / Math.sin(halfAngle) * 1.06;
  controls.target.set(0,targetHeight,0);
  controls.maxDistance = Math.max(70, distance*2);
  camera.position.set(.82,1.02,['all','dining'].includes(current) ? -1 : 1).normalize().multiplyScalar(distance).add(controls.target);
  controls.update();
  frameKey = current;
}

// Cabinet faces are laid out in local width/depth coordinates, then turned
// to face the dining area. Subdivisions are visual proportions from photos.
function buildDiningCabinet(asset, [x,y], box, group) {
  const [{box:[px,py,w,d],height}] = asset.parts;
  const vertical = asset.facing === 'right';
  const span = vertical ? d : w;
  const depth = vertical ? w : d;
  const wood = '#523828', white = '#eeeae3', dark = '#24211e', smoke = '#303536';
  function board(u,v,width,thickness,base,top,color,opacity=1) {
    const position = vertical
      ? [x+px+v,y+py+span-u-width,thickness,width]
      : [x+px+u,y+py+depth-v-thickness,width,thickness];
    box(...position,top-base,color,base,opacity,group);
  }
  function doors(start, width, count, base, top) {
    const pitch = width/count;
    for (let i=0; i<count; i++) {
      board(start+i*pitch+.45,depth-2,pitch-.9,2,base,top,white);
    }
  }
  const short = asset.cabinet === 'sideboard';
  const counter = short ? height-3 : height*.38;
  const toe = short ? 13 : 4;
  board(0,0,3,depth,0,counter,wood);
  board(span-3,0,3,depth,0,counter,wood);
  board(3,0,span-6,2,toe,counter,wood);
  board(3,2,span-6,depth-4,toe,toe+3,dark);
  board(0,0,span,depth,counter-3,counter,wood);
  doors(3,span-6,short ? 4 : 5,toe+1,counter-4);
  if (short) {
    board(0,0,span,2,counter,height,wood);
    board(0,2,3,depth-3,counter,height,wood);
    board(span-3,2,3,depth-3,counter,height,wood);
    return;
  }

  const glassEnd = span*.61, drawerEnd = span*.80;
  const glassBottom = height*.69, drawersTop = height*.66;
  board(0,0,span,2,counter,height,wood);
  board(0,0,span,depth,height-3,height,wood);
  for (const edge of [0,glassEnd,drawerEnd,span-3]) {
    board(edge,2,3,depth-2,counter,height-3,wood);
  }
  board(3,2,glassEnd-5,depth*.72,counter+29,counter+32,wood);
  for (const shelf of [glassBottom,glassBottom+23]) {
    board(3,2,glassEnd-3,depth-5,shelf,shelf+2,wood);
  }
  const pitch = (glassEnd-3)/3;
  for (let i=0; i<3; i++) {
    const u = 3+i*pitch;
    const top = height-4;
    for (const edge of [u,u+pitch-1.4]) {
      board(edge,depth-2,1.4,2,glassBottom,top,dark);
    }
    board(u,depth-2,pitch,2,glassBottom,glassBottom+1.4,dark);
    board(u,depth-2,pitch,2,top-1.4,top,dark);
    board(u+1.4,depth-1.5,pitch-2.8,1,glassBottom+1.4,top-1.4,smoke,.73);
  }
  board(glassEnd+3,2,drawerEnd-glassEnd-3,depth-4,drawersTop,drawersTop+2,wood);
  const drawerHeight = (drawersTop-counter)/3;
  for (let i=0; i<3; i++) {
    const base = counter+i*drawerHeight;
    board(glassEnd+3,depth-2,drawerEnd-glassEnd-3.5,2,base+1,base+drawerHeight-1,white);
  }
  doors(drawerEnd+3,span-drawerEnd-6,1,counter+1,height-4);
}

function buildMediaWall(asset, [ox,oy], box, group) {
  const wood = '#523a2d', dark = '#232325', white = '#edeae6';
  const [left,base,right] = asset.parts;
  for (const {box:[x,y,w,d],height} of [left,right]) {
    const add = (u,v,width,depth,bottom,top,color,opacity=1) =>
      box(ox+x+u,oy+y+v,width,depth,top-bottom,color,bottom,opacity,group);
    add(0,d-2,w,2,4,height,wood);
    for (const side of [0,w-2]) {
      add(side,0,2,d,0,height,wood);
      add(side,0,2,1,4,height-2,dark);
    }
    for (const level of [4,44,83,122,161,200,height-2]) {
      add(2,2,w-4,d-4,level,level+2,wood);
    }
    for (const level of [4,height-4]) add(2,0,w-4,1,level,level+2,dark);
    add(2,1,w-4,1,6,height-4,'#333d40',.42);
  }
  const {box:[x,y,w,d],height} = base;
  box(ox+x,oy+y+2,w,d-2,height-5,wood,2,1,group);
  box(ox+x,oy+y,w,d,3,wood,height-3,1,group);
  for (let i=0; i<6; i++) {
    box(ox+x+i*w/6+.55,oy+y,w/6-1.1,2,height-9,white,5,1,group);
  }
  const screenWidth = w*.74, screenHeight = screenWidth*9/16;
  box(ox+x+(w-screenWidth)/2,oy+y+d-5,screenWidth,3,screenHeight,dark,74,1,group);
  box(ox+x+(w-screenWidth)/2+1,oy+y+d-5.4,screenWidth-2,.5,screenHeight-2,'#161c21',75,1,group);
}

function updateKitchenLeaf() {
  const leaf = model?.getObjectByName('kitchen-sliding-leaf');
  if (leaf) leaf.position[leaf.userData.axis] = kitchenSlide*leaf.userData.travel;
}

function buildFloorSlider(wall, opening, strip) {
  const {sill,head,jamb,rail,frame,trackOffset} = opening.floorSlider;
  const {from,to} = opening;
  const {start,leafWidth,travel} = floorSliderLayout(opening);
  const stop = start+leafWidth;
  const metal = '#202427';
  const assembly = new three.Group();
  assembly.name = opening.id;
  model.add(assembly);
  strip(assembly,from,start,sill,head,8,metal);
  strip(assembly,to-jamb,to,sill,head,8,metal);
  for (const offset of [-trackOffset,trackOffset]) {
    strip(assembly,from,to,sill,sill+rail,1.5,metal,offset);
    strip(assembly,from,to,head-rail,head,1.5,metal,offset);
  }
  const leaf = new three.Group();
  leaf.name = 'kitchen-sliding-leaf';
  leaf.userData.axis = wall.axis === 'h' ? 'x' : 'z';
  leaf.userData.travel = travel/100;
  assembly.add(leaf);
  const bottom = sill+rail, top = head-rail;
  strip(leaf,start,start+frame,bottom,top,2.5,metal,trackOffset);
  strip(leaf,stop-frame,stop,bottom,top,2.5,metal,trackOffset);
  strip(leaf,start+frame,stop-frame,bottom,bottom+frame,2.5,metal,trackOffset);
  strip(leaf,start+frame,stop-frame,top-frame,top,2.5,metal,trackOffset);
  strip(leaf,start+frame,stop-frame,bottom+frame,top-frame,.8,'#9db3bb',trackOffset,.29);
  updateKitchenLeaf();
}

function buildPhotoBed(f,x,y,box,group) {
  const turns = (f.turns || 0)%4;
  const length = turns%2 ? f.d : f.w;
  const width = turns%2 ? f.w : f.d;
  const clearance = Math.min(calibration.bed.find(record => record.field === 'underframeClearance').value,f.h*.24);
  const platform = f.h*.36, mattress = f.h*.54;
  const wood = '#78513b', trim = '#62402f';
  function part(u,v,l,w,bottom,top,color) {
    const bounds = [
      [u,v,l,w], [width-v-w,u,w,l],
      [length-u-l,width-v-w,l,w], [v,length-u-l,w,l]
    ][turns];
    const [dx,dy,px,py] = bounds;
    return box(x+f.x+dx,y+f.y+dy,px,py,top-bottom,color,bottom,1,group);
  }
  for (const u of [length*.12,length*.80]) {
    for (const v of [width*.09,width*.82]) part(u,v,length*.075,width*.09,0,clearance,trim);
  }
  part(0,0,length,width,clearance,platform,wood);
  const headboard = part(0,width*.02,length*.035,width*.96,platform,f.h,wood);
  const halfWidth = width*.96/200, halfHeight = (f.h-platform)/200;
  const radius = Math.min(.12,halfWidth*.4,halfHeight*.5);
  const outline = new three.Shape();
  outline.moveTo(-halfWidth,-halfHeight);
  outline.lineTo(halfWidth,-halfHeight);
  outline.lineTo(halfWidth,halfHeight-radius);
  outline.quadraticCurveTo(halfWidth,halfHeight,halfWidth-radius,halfHeight);
  outline.lineTo(-halfWidth+radius,halfHeight);
  outline.quadraticCurveTo(-halfWidth,halfHeight,-halfWidth,halfHeight-radius);
  outline.closePath();
  headboard.geometry.dispose();
  headboard.geometry = new three.ExtrudeGeometry(outline,{depth:length*.035/100,bevelEnabled:false});
  headboard.geometry.translate(0,0,-length*.035/200);
  headboard.rotation.y = (turns+1)*Math.PI/2;
  part(length*.045,width*.027,length*.925,width*.946,platform,mattress,f.c);
  part(length*.065,width*.30,length*.15,width*.40,mattress,mattress+f.h*.065,f.c);
}

function buildLivingSofa(f,[x,y],box,group) {
  const [px,py,h]=[f.x,f.y,f.h], turns=((f.turns||0)%4+4)%4;
  const [w,d]=turns%2 ? [f.d,f.w] : [f.w,f.d];
  const wood='#67412e', edge='#4f3225', seat='#79523e';
  function add(u,v,width,depth,bottom,top,color) {
    const [dx,dy,pxw,pyd]=[
      [u,v,width,depth],
      [d-v-depth,u,depth,width],
      [w-u-width,d-v-depth,width,depth],
      [v,w-u-width,depth,width]
    ][turns];
    return box(x+px+dx,y+py+dy,pxw,pyd,top-bottom,color,bottom,1,group);
  }
  for (const u of [7,w-15]) {
    for (const v of [8,d-13]) add(u,v,8,7,0,h*.22,edge);
  }
  add(2,4,w-4,d-7,h*.16,h*.41,wood);
  add(5,d-4,w-10,3,h*.20,h*.255,edge);
  const seatWidth=(w-20)/2;
  for (let i=0;i<2;i++) {
    const u=10+i*seatWidth;
    add(u+.35,12,seatWidth-.7,d-16,h*.40,h*.49,seat);
    const back=add(u+.35,3,seatWidth-.7,5,h*.47,h*.98,wood);
    const halfWidth=(seatWidth-.7)/200, halfHeight=h*.51/200, radius=.075;
    const outline=new three.Shape();
    outline.moveTo(-halfWidth,-halfHeight);
    outline.lineTo(halfWidth,-halfHeight);
    outline.lineTo(halfWidth,halfHeight-(i===1 ? radius : 0));
    if (i===1) outline.quadraticCurveTo(halfWidth,halfHeight,halfWidth-radius,halfHeight);
    outline.lineTo(-halfWidth+(i===0 ? radius : 0),halfHeight);
    if (i===0) outline.quadraticCurveTo(-halfWidth,halfHeight,-halfWidth,halfHeight-radius);
    outline.closePath();
    back.geometry.dispose();
    back.geometry=new three.ExtrudeGeometry(outline,{depth:.05,bevelEnabled:false});
    back.geometry.translate(0,0,-.025);
    back.rotation.x=-.13;
    back.rotation.y=turns*Math.PI/2;
  }
  for (const u of [0,w-9]) {
    add(u,7,9,d-11,h*.40,h*.58,wood);
    add(u,7,9,d-12,h*.58,h*.66,seat);
    add(u+1,d-10,7,5,h*.18,h*.64,edge);
  }
  const cushion=add(w*.38,d*.44,w*.20,d*.27,h*.49,h*.55,'#d8ccbb');
  cushion.rotation.y=.22;
}

function cabinetElevation(part,[ox,oy],facing,box,group) {
  const [px,py,w,d] = part.box;
  const x=ox+px, y=oy+py;
  const acrossY = facing === 'east' || facing === 'west';
  const span = acrossY ? d : w, depth = acrossY ? w : d;
  function point(u,v) {
    switch (facing) {
      case 'east': return [x+v,y+d-u];
      case 'west': return [x+w-v,y+u];
      case 'north': return [x+u,y+d-v];
      case 'south': return [x+w-u,y+v];
    }
  }
  function board(u,v,width,thickness,base,top,color,corner) {
    if (width<=0 || thickness<=0 || top<=base) return;
    const [ax,az]=point(u,v), [bx,bz]=point(u+width,v+thickness);
    const mesh=box(Math.min(ax,bx),Math.min(az,bz),Math.abs(bx-ax),Math.abs(bz-az),top-base,color,base,1,group);
    if (!corner) return mesh;
    const radius=Math.min(width*.4,thickness*.5,7);
    const shape=new three.Shape(), cx=(ax+bx)/2, cz=(az+bz)/2;
    const local=(a,b) => {const [gx,gz]=point(u+a,v+b); return [(gx-cx)/100,(cz-gz)/100];};
    shape.moveTo(...local(0,0));
    shape.lineTo(...local(width,0));
    shape.lineTo(...local(width,thickness-(corner==='end' ? radius : 0)));
    if (corner==='end') shape.quadraticCurveTo(...local(width,thickness),...local(width-radius,thickness));
    shape.lineTo(...local(corner==='start' ? radius : 0,thickness));
    if (corner==='start') shape.quadraticCurveTo(...local(0,thickness),...local(0,thickness-radius));
    shape.closePath();
    mesh.geometry.dispose();
    mesh.geometry=new three.ExtrudeGeometry(shape,{depth:(top-base)/100,bevelEnabled:false});
    mesh.geometry.translate(0,0,-(top-base)/200);
    mesh.rotation.x=-Math.PI/2;
    return mesh;
  }
  return {span,depth,board};
}

function buildBedroomCabinet(asset,origin,box,group) {
  const profile=bedroomCabinetProfiles[asset.id];
  const [body,returnDesk]=asset.parts;
  const elevation=cabinetElevation(body,origin,profile.facing,box,group);
  const {span,depth,board}=elevation;
  const wood='#614331', inside='#493225', face='#ece8dd';
  const top=body.height;
  const deskTop=profile.standalone ? previewGeometry.deskHeight : returnDesk?.height;
  const header=top*(1-profile.ceilingBand);
  const substrate=2, reveal=.65;
  const wallFace=previewGeometry.wallThickness/2+.5;
  function fronts(draw,depth,u,width,bottom,top,count) {
    const pitch=width/count;
    for(let i=0;i<count;i++) {
      draw(u+i*pitch+reveal/2,depth-2,pitch-reveal,2,bottom+reveal/2,top-reveal/2,face);
    }
  }
  function openBay(u,width,bottom,ceiling,levels,rounded) {
    board(u,wallFace,width,substrate,bottom,ceiling,inside);
    // A rounded exposed end has no full-depth side panel hiding the curve.
    const leftDepth=rounded==='start' ? depth*.45 : depth-2;
    const rightDepth=rounded==='end' ? depth*.45 : depth-2;
    board(u,wallFace+2,substrate,leftDepth-wallFace-2,bottom,ceiling,wood);
    board(u+width-substrate,wallFace+2,substrate,rightDepth-wallFace-2,bottom,ceiling,wood);
    for(const ratio of levels) {
      const height=bottom+(ceiling-bottom)*ratio;
      board(u,wallFace,width,depth-wallFace,height,height+2.4,wood,rounded);
    }
  }
  function desktop({board:draw,span:width,depth:reach},height,support,rounded) {
    draw(0,0,width,reach,height-3,height,wood,rounded);
    draw(0,wallFace,width,2,0,height-3,inside);
    if (support==='both' || support==='start') draw(0,2,2.5,reach-2,0,height-3,wood);
    if (support==='both' || support==='end') draw(width-2.5,2,2.5,reach-2,0,height-3,wood);
    draw(2.5,reach-14,width-5,12,height-13,height-3,inside);
    fronts(draw,reach,2.5,width-5,height-13,height-3,2);
  }

  if (profile.standalone) {
    desktop(elevation,deskTop,'both');
    openBay(0,span,deskTop,header,[.60]);
    board(0,0,span,depth-2,header,top-1.5,wood);
    fronts(board,depth,0,span,header,top-1.5,2);
    board(0,0,span,depth,top-1.5,top,wood);
    return;
  }

  let u=0;
  for (const bay of profile.bays) {
    const width=span*bay.width;
    board(u,0,width,depth-2,header,top-1.5,wood);
    fronts(board,depth,u,width,header,top-1.5,bay.count ?? 1);
    if (bay.kind==='rounded') {
      openBay(u,width,4,header,[0,.18,.36,.79],bay.corner);
      board(u,0,width,depth,0,4,wood,bay.corner);
    } else if (bay.kind==='study') {
      openBay(u,width,deskTop,header,[.34,.68]);
      board(u,0,width,depth,deskTop-3,deskTop,wood);
      board(u,wallFace,width,2,0,deskTop-3,inside);
      board(u,2,2,depth-2,0,deskTop-3,wood);
      board(u+width-2,2,2,depth-2,0,deskTop-3,wood);
    } else {
      const split=top*bay.split;
      board(u,0,width,depth-2,4,header,inside);
      board(u,0,width,depth-1,0,4,wood);
      fronts(board,depth,u,width,split,header,bay.count);
      if (bay.kind==='drawers') {
        const pitch=(split-4)/bay.rows;
        for(let i=0;i<bay.rows;i++) fronts(board,depth,u,width,4+i*pitch,4+(i+1)*pitch,1);
      } else {
        fronts(board,depth,u,width,4,split,bay.count);
      }
    }
    u+=width;
  }
  board(0,0,span,depth,top-1.5,top,wood);
  if (returnDesk) {
    const end=profile.desktop==='north' ? 'end' : 'start';
    desktop(cabinetElevation(returnDesk,origin,profile.desktop,box,group),deskTop,end,end);
  }
}

async function build3() {
  try {
    loading3d ??= initialize3d();
    await loading3d;
    if (mode !== '3') return;
    if (model) {
      scene.remove(model);
      model.traverse(node => {
        if (!node.isMesh) return;
        node.geometry.dispose();
        node.material.dispose();
      });
    }
    wallLayers = [];
    model = new three.Group();
    scene.add(model);
    const [ox,oy,w,h] = viewBox();
    function box(x,y,width,depth,height,color,base=0,opacity=1,parent=model) {
      if (width <= 0 || depth <= 0 || height <= 0) return;
      const mesh = new three.Mesh(new three.BoxGeometry(width/100,height/100,depth/100),
        new three.MeshStandardMaterial({color,opacity,transparent:opacity < 1,roughness:.78}));
      mesh.position.set((x+width/2-ox-w/2)/100,(base+height/2)/100,(y+depth/2-oy-h/2)/100);
      parent.add(mesh);
      return mesh;
    }
    for (const key of roomKeys()) {
      const [x,y,width,depth] = plan.rooms[key].box;
      box(x,y,width,depth,4,'#f2f1ee',-4);
      for (const f of furniture(key)) {
        const group=new three.Group();
        group.userData.furniture={room:key,id:f.id};
        model.add(group);
        if (f.model === 'photo-bed') buildPhotoBed(f,x,y,box,group);
        else if (f.model === 'photo-sofa') buildLivingSofa(f,[x,y],box,group);
        else box(x+f.x,y+f.y,f.w,f.d,f.h,f.c,0,1,group);
        if (current===key && selected===f.id) {
          for (const mesh of group.children) {
            mesh.material.emissive.set('#792f22');
            mesh.material.emissiveIntensity=.38;
          }
        }
      }
      for (const asset of plan.fixed.filter(a => a.room === key)) {
        if (asset.cabinet) {
          const cabinet = new three.Group();
          cabinet.name = asset.id;
          model.add(cabinet);
          if (asset.cabinet === 'media-wall') buildMediaWall(asset,[x,y],box,cabinet);
          else buildDiningCabinet(asset,[x,y],box,cabinet);
          continue;
        }
        if (bedroomCabinetProfiles[asset.id]) {
          const cabinet = new three.Group();
          cabinet.name = asset.id;
          model.add(cabinet);
          buildBedroomCabinet(asset,[x,y],box,cabinet);
          continue;
        }
        // The hall cabinet retains its existing elevation.
        const [{box:[px,py,pw,pd],height}] = asset.parts;
        const cx=x+px, cy=y+py;
        box(cx+1,cy+1,pw-2,pd-2,6,'#554237');
        box(cx,cy+2,pw,pd-2,height-6,'#655344',6);
        box(cx+1,cy,pw-2,2,height*.40-7,'#ebe7df',7);
        box(cx+1,cy+2,pw-2,8,2,'#70513e',height*.40);
        box(cx+1,cy,pw-2,2,height*.38-1,'#ebe7df',height*.62);
      }
    }
    for (const wall of visibleWalls()) {
      const horizontal = wall.axis === 'h';
      const min = horizontal ? ox : oy;
      const max = min + (horizontal ? w : h);
      const normalCenter = horizontal ? oy+h/2 : ox+w/2;
      const sides = new Set(wall.rooms.filter(key => current === 'all' || key === current).map(key => {
        const [x,y,width,depth] = plan.rooms[key].box;
        const roomCenter = horizontal ? y+depth/2 : x+width/2;
        return Math.sign(wall.at-roomCenter);
      }));
      const upper = new three.Group(), lower = new three.Group();
      model.add(upper,lower);
      wallLayers.push({segment:wall,axis:wall.axis,side:sides.size === 1 ? [...sides][0] : 0,
        plane:(wall.at-normalCenter)/100,upper,lower});
      const {wallHeight,wallThickness,cutHeight,doorTop,windowSill,windowTop,frameWidth} = previewGeometry;
      function strip(group,a,b,base,top,thickness,color,offset=0,opacity=1) {
        const from = Math.max(a,min), to = Math.min(b,max);
        if (to <= from) return;
        const [x,y] = point(wall,from,offset-thickness/2);
        const [width,depth] = horizontal ? [to-from,thickness] : [thickness,to-from];
        box(x,y,width,depth,top-base,color,base,opacity,group);
      }
      function masonry(group,a,b,base,top) {
        strip(group,a,b,base,top,wallThickness,'#e8e2d8');
      }
      for (const [a,b] of segments(wall)) {
        masonry(upper,a,b,0,wallHeight);
        masonry(lower,a,b,0,cutHeight);
        strip(upper,a,b,0,6,wallThickness+1,'#c9bdab');
      }
      for (const opening of wall.openings) {
        const {from,to,type} = opening;
        const window = type === 'window';
        const sliding = slidingType(opening);
        const glass = window || type === 'sliding-glass-door';
        const sill = opening.floorSlider?.sill ?? (window ? windowSill : 0);
        const head = opening.floorSlider?.head ?? (window ? windowTop : doorTop);
        masonry(upper,from,to,0,sill);
        masonry(upper,from,to,head,wallHeight);
        if (window) masonry(lower,from,to,0,cutHeight);
        if (type === 'passage') continue;

        if (opening.floorSlider) {
          buildFloorSlider(wall,opening,strip);
          continue;
        }
        const frame = glass ? '#475e61' : '#766854';
        strip(upper,from,from+frameWidth,sill,head,8,frame);
        strip(upper,to-frameWidth,to,sill,head,8,frame);
        strip(upper,from,to,head-frameWidth,head,8,frame);
        if (window) strip(upper,from,to,sill,sill+frameWidth,12,frame);
        if (glass || sliding) {
          const panel = glass ? '#76adc0' : '#b2a18a';
          strip(upper,from+frameWidth,to-frameWidth,sill+frameWidth,head-frameWidth,
            2,panel,0,glass ? .42 : 1);
          if (sliding) {
            strip(lower,from,to,0,cutHeight,2,panel,0,glass ? .42 : 1);
            for (const group of [upper,lower]) {
              strip(group,from,to,0,3,1.5,frame,-5);
              strip(group,from,to,0,3,1.5,frame,5);
            }
          }
        }
      }
    }
    for (const key of roomKeys()) {
      const detail=sceneDetails[key];
      if (!detail) continue;
      const group=new three.Group();
      group.name=detail.id;
      model.add(group);
      buildEntryClock(detail,viewBox(),group,wallLayers);
    }
    size3d();
    if (frameKey !== current) frame3d();
    updateWallVisibility();
    $('status').textContent = '3D 示意已加载';
  } catch {
    loading3d = null;
    $('status').textContent = '3D 加载失败，可继续查看 2D';
  }
}

    applyEdit(()=>{
      f[key]=Math.round(value*10)/10;
      if (key==='w' || key==='d') setPosition(f,current,f.x,f.y);
    });
  };
}
$('scheme').onchange = e => {
  const layout=data.rooms[current], slot=e.target.value;
  layout.variants[slot] ??= structuredClone(layout.baseline);
  layout.active=slot;
  selected=null;
  save();
  sync();
};
$('copyScheme').onclick = () => {
  const layout=data.rooms[current], slot=slots.find(slot=>!layout.variants[slot]);
  if (!slot) return;
  layout.variants[slot]=structuredClone(furniture(current));
  layout.active=slot;
  save();
  sync();
};
$('undo').onclick = () => navigateHistory('undo');
$('redo').onclick = () => navigateHistory('redo');
document.addEventListener('keydown',event=>{
  if (!(event.ctrlKey || event.metaKey) || event.altKey ||
    event.target.closest('input,textarea,select,[contenteditable]')) return;
  const key=event.key.toLowerCase();
  if (key!=='z' && key!=='y') return;
  event.preventDefault();
  navigateHistory(key==='y' || event.shiftKey ? 'redo' : 'undo');
});

function addItem(item) {
  applyEdit(()=>{
    furniture(current).push(item);
    selected=item.id;
  });
}
$('addReferenceBed').onclick = () => {
  if (current==='bed' && !furniture('bed').some(f=>f.model==='photo-bed')) addItem(structuredClone(referenceBed));
};
$('add').onclick = () => {
  addItem({id:Date.now(),n:'新家具',x:40,y:40,w:80,d:50,h:75,c:'#d1bfae'});
};
$('rotate').onclick = () => {
  const f=selectedItem();
  if (!f) return;
  const [, ,width,depth]=plan.rooms[current].box;
  if (f.d>width || f.w>depth) {
    $('status').textContent='此家具旋转后的占地超出房间';
    return;
  }
  applyEdit(()=>{
    [f.w,f.d]=[f.d,f.w];
    if (f.model==='photo-bed' || f.model==='photo-sofa') f.turns=((f.turns || 0)+1)%4;
    setPosition(f,current,f.x,f.y);
  });
};
$('remove').onclick = () => {
  if (!selectedItem()) return;
  applyEdit(()=>{
    const items=furniture(current);
    items.splice(items.findIndex(f=>f.id===selected),1);
    selected=null;
  });
};
$('reset').onclick = () => {
  if (!confirm('恢复当前方案到本机初始布局？此操作可撤销。')) return;
  applyEdit(()=>{
    const layout=data.rooms[current];
    layout.variants[layout.active]=structuredClone(layout.baseline);
    selected=null;
  });
};
$('save').onclick = save;
$('homeview').onclick = () => { if (mode === '3' && camera) frame3d(); else if (mode === '2') setPlanZoom(1); };
$('zoomin').onclick=()=>setPlanZoom(planZoom+.2);
$('zoomout').onclick=()=>setPlanZoom(planZoom-.2);
$('plan').addEventListener('wheel',event=>{
  if(mode!=='2'||!event.ctrlKey) return;
  event.preventDefault();
  setPlanZoom(planZoom+(event.deltaY<0?.1:-.1));
},{passive:false});
$('kitchenslide').onchange = event => {
  kitchenSlide = Number(event.target.value);
  if (mode === '2') draw();
  else updateKitchenLeaf();
};
$('kitchenfront').onclick = () => {
  const wall = plan.walls.find(w => w.openings.some(o => o.floorSlider));
  const door = wall.openings.find(o => o.floorSlider);
  if (!camera || frameKey !== 'kitchen') return;
  const [ox,oy,w,h] = viewBox();
  const [x,z] = point(wall,(door.from+door.to)/2);
  const [cx,cz] = [(x-ox-w/2)/100,(z-oy-h/2)/100];
  const cy = door.floorSlider.head/200;
  controls.target.set(cx,cy,cz);
  camera.position.set(cx-3.5,cy+.11,cz);
  $('walls').value = 'full';
  controls.update();
  updateWallVisibility();
};
$('b2').onclick = () => setMode('2');
$('b3').onclick = () => setMode('3');
window.addEventListener('resize',size3d);
setMode('2');
</script></body></html>
