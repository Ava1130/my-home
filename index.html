<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY HOME · 家居实验室</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#191919;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{height:60px;background:white;border-bottom:1px solid #e5e5e5;display:flex;align-items:center;justify-content:space-between;padding:0 24px}header strong{font-size:18px}.tag{font-size:12px;color:#666;background:#f4f4f4;padding:7px 10px;border-radius:20px}.layout{height:calc(100vh - 60px);display:grid;grid-template-columns:260px minmax(0,1fr)}aside{padding:22px;background:#fff;border-right:1px solid #e7e7e7;overflow:auto}h3{margin:4px 0 15px;font-size:15px}label{display:block;color:#666;font-size:12px;margin:13px 0 6px}input,select,button{font:inherit;border-radius:9px;border:1px solid #dedede;padding:10px;background:#fff;max-width:100%}input,select{width:100%}button{cursor:pointer}button:hover{background:#f6f6f6}.primary{background:#e60012;color:white;border-color:#e60012}.primary:hover{background:#c90011}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.stage{min-width:0;display:flex;flex-direction:column}.bar{padding:12px 20px;display:flex;gap:8px;background:white;border-bottom:1px solid #eaeaea;align-items:center;flex-wrap:wrap}.bar button.active{background:#171717;color:white}.view{position:relative;flex:1;min-height:0;overflow:hidden;display:flex;justify-content:center;align-items:center}.plan{width:min(95%,1050px);height:min(94%,800px);touch-action:none}.plan svg{width:100%;height:100%;overflow:visible}.room{fill:#eee9de;stroke:#262626;stroke-width:9;cursor:pointer}.room:hover{fill:#e5e0d5}.room.active{fill:#f4f0e9}.roomname{font-size:21px;fill:#333;pointer-events:none;text-anchor:middle}.area{font-size:15px;fill:#777;pointer-events:none;text-anchor:middle}.window{stroke:#8bc8e5;stroke-width:10}.door{stroke:#fefefe;stroke-width:11}.furniture{cursor:grab;touch-action:none}.furniture rect{stroke:#777;stroke-width:1.5}.furniture.selected rect{stroke:#e60012;stroke-width:4}.furniture text{pointer-events:none;font-size:12px;fill:#222}.note{position:absolute;bottom:16px;left:18px;font-size:12px;color:#777;background:#ffffffcf;padding:8px;border-radius:8px}#three{position:absolute;inset:0;display:none}#three canvas{display:block}.sep{border:0;border-top:1px solid #eee;margin:20px 0}.hint{font-size:12px;color:#888;line-height:1.7}.dim{font-size:12px;color:#777}.hidden{display:none!important}@media(max-width:700px){.layout{grid-template-columns:180px minmax(0,1fr)}aside{padding:12px}.bar{padding:8px}.bar button{padding:7px}}
</style></head><body><header><strong>MY HOME <span style="color:#999;font-weight:400">· 家居实验室</span></strong><span class="tag">V3.3 · 视角优化</span></header><div class="layout"><aside><h3>空间</h3><label>查看范围</label><select id="room"><option value="all">全屋户型</option><option value="studio">15㎡多功能房</option><option value="bed">12.6㎡次卧</option><option value="master">13.1㎡主卧</option><option value="living">客厅与餐厅</option></select><div id="roomdims"><div class="row"><div><label>宽 cm</label><input id="rw" type="number"></div><div><label>深 cm</label><input id="rd" type="number"></div></div></div><hr class="sep"><h3>家具</h3><button class="primary" id="add" style="width:100%">＋ 添加家具</button><div id="editor"><label>选择家具</label><select id="items"></select><label>名称</label><input id="name"><div class="row"><div><label>宽 cm</label><input id="fw" type="number"></div><div><label>深 cm</label><input id="fd" type="number"></div><div><label>高 cm</label><input id="fh" type="number"></div></div><label>颜色</label><input id="color" type="color"><div class="row" style="margin-top:10px"><button id="rotate">旋转 90°</button><button id="remove">删除</button></div></div><hr class="sep"><button id="reset">恢复当前空间</button><p class="hint">房间与家具尺寸单位为厘米。2D 可拖动家具；3D 可旋转和缩放。家具布局保存在当前浏览器。</p></aside><main class="stage"><div class="bar"><span style="font-weight:600;margin-right:8px">视图</span><button id="b2" class="active">2D 平面</button><button id="b3">3D 空间</button><button id="homeview">重置视角</button><button id="save">保存</button><span id="status" class="dim"></span></div><div class="view"><div class="plan" id="plan"></div><div id="three"></div><div class="note" id="note">全屋户型依据提供的平面图近似重建；门窗与墙厚待实测校准</div></div></main></div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.164.1';
import {OrbitControls} from 'https://esm.sh/three@0.164.1/examples/jsm/controls/OrbitControls.js';
const $=id=>document.getElementById(id),S=100;
const specs={studio:{w:410,d:350,label:'次卧 · 15.0㎡',x:0,y:440},bed:{w:410,d:290,label:'次卧 · 12.6㎡',x:410,y:0},master:{w:420,d:290,label:'主卧 · 13.1㎡',x:820,y:0},bath:{w:300,d:150,label:'主卫 · 4.9㎡',x:410,y:290},hall:{w:220,d:150,label:'过道 · 3.8㎡',x:710,y:290},kitchen:{w:310,d:150,label:'厨房 · 5.3㎡',x:930,y:290},dining:{w:400,d:350,label:'餐厅 · 14.8㎡',x:410,y:440},living:{w:430,d:350,label:'客厅 · 15.4㎡',x:810,y:440},balcony:{w:120,d:350,label:'阳台 · 5.1㎡',x:1240,y:440}};
const defaults={studio:[{id:1,n:'沙发床',x:135,y:20,w:145,d:80,h:80,c:'#c9b6a4'},{id:2,n:'升降桌',x:310,y:100,w:65,d:130,h:75,c:'#795f4a'},{id:3,n:'父亲电脑桌',x:15,y:280,w:100,d:55,h:75,c:'#b7b7b7'}],bed:[],master:[],living:[]};
let saved;try{saved=JSON.parse(localStorage.getItem('myhome-v32'))}catch{}const data=saved&&saved.f? saved:{f:structuredClone(defaults)};
let current='all',selected=null,mode='2',renderer,scene,camera,controls,drag=null;
function list(){return data.f[current]||[]}
function item(){return list().find(x=>x.id===selected)}
function save(){localStorage.setItem('myhome-v32',JSON.stringify(data));$('status').textContent='已保存'}
function roomRect(k){let p=specs[k];return '<rect class="room '+(current===k?'active':'')+'" data-room="'+k+'" x="'+p.x+'" y="'+p.y+'" width="'+p.w+'" height="'+p.d+'"/><text class="roomname" x="'+(p.x+p.w/2)+'" y="'+(p.y+p.d/2-5)+'">'+p.label.split(' · ')[0]+'</text><text class="area" x="'+(p.x+p.w/2)+'" y="'+(p.y+p.d/2+22)+'">'+(p.label.split(' · ')[1]||'')+'</text>'}
function windows(){return '<path class="window" d="M130 440 H270 M540 0 H670 M1240 110 V205 M1240 320 V405 M1360 560 V705"/><path class="door" d="M410 680 V740 M720 290 H775 M875 290 H930 M520 440 H580 M740 440 H800 M1020 440 H1080"/>'}
function furn(f,ox=0,oy=0){return '<g class="furniture '+(selected===f.id?'selected':'')+'" data-id="'+f.id+'" transform="translate('+(ox+f.x)+' '+(oy+f.y)+')"><rect width="'+f.w+'" height="'+f.d+'" fill="'+f.c+'"/><text x="8" y="20">'+f.n.replaceAll('&','&amp;').replaceAll('<','&lt;')+'</text></g>'}
function draw(){const all=current==='all',p=all?{w:1360,d:790,x:0,y:0}:specs[current],pad=65;let content='';if(all){content=Object.keys(specs).map(roomRect).join('')+windows();for(let k of Object.keys(data.f)){const r=specs[k];if(r)content+=(data.f[k]||[]).map(f=>furn(f,r.x,r.y)).join('')}}else{content='<rect class="room active" x="0" y="0" width="'+p.w+'" height="'+p.d+'"/>';if(current==='studio')content+='<path class="window" d="M100 0 H270"/><path class="door" d="M'+p.w+' 270 V330"/>';content+=list().map(f=>furn(f)).join('')}let svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+(-pad)+' '+(-pad)+' '+(p.w+pad*2)+' '+(p.d+pad*2)+'" preserveAspectRatio="xMidYMid meet"><g id="drawing">'+content+'</g></svg>';$('plan').innerHTML=svg;
$('plan').querySelectorAll('[data-room]').forEach(el=>el.addEventListener('click',e=>{if(e.target.closest('[data-id]'))return;let k=el.dataset.room;if(k==='bath'||k==='hall'||k==='kitchen'||k==='dining'||k==='balcony')return;current=k;$('room').value=k;selected=null;sync()}));
$('plan').querySelectorAll('[data-id]').forEach(el=>el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();const id=+el.dataset.id;const k=current==='all'?Object.keys(data.f).find(key=>data.f[key].some(f=>f.id===id)):current;if(current==='all'){current=k;$('room').value=k;selected=id;sync();return}selected=id;const f=item(),svg=$('plan').querySelector('svg'),pt=svg.createSVGPoint();function loc(ev){pt.x=ev.clientX;pt.y=ev.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse())}const st=loc(e),ox=f.x,oy=f.y;el.setPointerCapture(e.pointerId);el.classList.add('selected');el.onpointermove=ev=>{let q=loc(ev),r=specs[current];f.x=Math.round(Math.max(0,Math.min(r.w-f.w,ox+q.x-st.x)));f.y=Math.round(Math.max(0,Math.min(r.d-f.d,oy+q.y-st.y)));el.setAttribute('transform','translate('+f.x+' '+f.y+')')};el.onpointerup=()=>{el.onpointermove=null;save();sync()}}))}
function sync(){const all=current==='all',r=specs[current];$('roomdims').style.display=all?'none':'block';$('editor').style.display=all?'none':'block';$('add').disabled=all;$('reset').disabled=all;if(!all){$('rw').value=r.w;$('rd').value=r.d;let f=item();$('items').innerHTML=list().map(o=>'<option value="'+o.id+'">'+o.n+'</option>').join('');$('items').value=selected??'';for(let id of ['name','fw','fd','fh','color']){$(id).disabled=!f;$(id).value=f?(id==='name'?f.n:id==='color'?f.c:f[id.slice(1)]):''}}if(mode==='2')draw();else build3()}
function setMode(m){mode=m;$('plan').style.display=m==='2'?'block':'none';$('three').style.display=m==='3'?'block':'none';$('b2').classList.toggle('active',m==='2');$('b3').classList.toggle('active',m==='3');$('note').textContent=m==='3'?'拖动鼠标旋转 · 滚轮缩放 · 墙高暂按 2.6m': '根据户型图重建的近似结构 · 门窗与墙厚待校准';sync()}
function build3(){const host=$('three');try{if(!renderer){scene=new THREE.Scene();scene.background=new THREE.Color('#f5f5f7');camera=new THREE.PerspectiveCamera(45,1,.1,100);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));host.appendChild(renderer.domElement);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0xaaaaaa,2));let light=new THREE.DirectionalLight(0xffffff,1.6);light.position.set(4,9,5);scene.add(light);function loop(){requestAnimationFrame(loop);if(mode==='3'){controls.update();renderer.render(scene,camera)}}loop()}for(let x of [...scene.children])if(x.userData.model)scene.remove(x);const group=new THREE.Group();group.userData.model=true;scene.add(group);let keys=current==='all'?Object.keys(specs):[current];let p=current==='all'?{w:1360,d:790,x:0,y:0}:specs[current];const addBox=(w,h,d,x,y,z,col)=>{let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:col,roughness:.88}));m.position.set(x,y,z);group.add(m)};for(let k of keys){let r=specs[k],x=(r.x-p.x+r.w/2-p.w/2)/100,z=(r.y-p.y+r.d/2-p.d/2)/100;addBox(r.w/100,.04,r.d/100,x,-.02,z,k==='studio'?'#e8e6e1':'#eeeae3');let wallH=.35;addBox(r.w/100,wallH,.065,x,wallH/2,z-r.d/200,'#ffffff');addBox(.065,wallH,r.d/100,x-r.w/200,wallH/2,z,'#fafafa');for(let f of data.f[k]||[]){addBox(f.w/100,f.h/100,f.d/100,(r.x-p.x+f.x+f.w/2-p.w/2)/100,f.h/200,(r.y-p.y+f.y+f.d/2-p.d/2)/100,f.c)}}const w=host.clientWidth,h=host.clientHeight;if(w>0&&h>0){renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}let max=Math.max(p.w,p.d)/100;camera.position.set(max*.72,max*1.12,max*.95);controls.target.set(0,0,0);controls.minDistance=1;controls.maxDistance=100;camera.near=.05;camera.far=200;camera.updateProjectionMatrix();controls.update();$('status').textContent='3D 已加载'}catch(e){host.textContent='3D 加载失败：'+e.message}}
$('room').onchange=e=>{current=e.target.value;selected=null;sync()};$('items').onchange=e=>{selected=+e.target.value;sync()};for(let id of ['name','fw','fd','fh','color'])$(id).onchange=e=>{let f=item();if(!f)return;let k=id==='name'?'n':id==='color'?'c':id.slice(1);f[k]=['name','color'].includes(id)?e.target.value:Math.max(1,+e.target.value||1);save();sync()};$('add').onclick=()=>{let f={id:Date.now(),n:'新家具',x:40,y:40,w:80,d:50,h:75,c:'#d1bfae'};data.f[current]??=[];data.f[current].push(f);selected=f.id;save();sync()};$('rotate').onclick=()=>{let f=item();if(!f)return;[f.w,f.d]=[f.d,f.w];save();sync()};$('remove').onclick=()=>{data.f[current]=list().filter(f=>f.id!==selected);selected=null;save();sync()};$('reset').onclick=()=>{if(confirm('恢复这个空间的家具初始布局？')){data.f[current]=structuredClone(defaults[current]||[]);selected=null;save();sync()}};$('save').onclick=save;$('homeview').onclick=()=>{if(mode==='3')build3();else draw()};$('b2').onclick=()=>setMode('2');$('b3').onclick=()=>setMode('3');for(let id of ['rw','rd'])$(id).onchange=e=>{let r=specs[current];r[id==='rw'?'w':'d']=Math.max(100,+e.target.value||100);sync()};window.addEventListener('resize',()=>{if(mode==='3')build3()});setMode('2');
</script></body></html>
